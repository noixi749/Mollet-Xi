<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>イツキくんち</title><meta name="theme-color" content="#F3EEE2"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  color-scheme: light;
  --bg:#F3EEE2; --card:#FFFCF5; --ink:#22302A; --muted:#6B7167; --line:#E3DBCA;
  --green:#2F6B4F; --green-press:#275B43; --green-soft:#E2EFE5;
  --arrow:#E0572E; --arrow-dark:#B33F1D;
  --warn-bg:#FFF0D3; --warn-ink:#5A3A00;
  --live:#2FA05F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;-webkit-user-select:none;user-select:none}
body{min-height:100vh;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
main{max-width:480px;margin:0 auto}

header{display:flex;align-items:center;gap:8px;padding:10px 0 2px}
header svg{width:38px;height:38px;flex:none;margin-left:-4px}
header h1{font-size:19px;font-weight:800;margin:0;letter-spacing:.03em}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:#BDB8AA;flex:none}
.dot.live{background:var(--live);animation:pulse 1.6s infinite}
.dot.weak{background:#E0A43A}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,160,95,.55)}70%{box-shadow:0 0 0 7px rgba(47,160,95,0)}100%{box-shadow:0 0 0 0 rgba(47,160,95,0)}}

.hero{text-align:center;padding:4px 0 0}
.to{font-size:15px;font-weight:700;color:var(--muted)}
.to b{color:var(--ink)}
.dist{font-size:62px;font-weight:800;line-height:1.08;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dist .unit{font-size:26px;font-weight:700;margin-left:5px;letter-spacing:0}
.dist.wait{color:#B4AE9F}
.sub{font-size:13px;color:var(--muted);min-height:19px;font-variant-numeric:tabular-nums}
.sub b{color:var(--green);font-weight:700}

.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.55;margin:10px 0 0;display:flex;gap:10px;align-items:center}
.notice p{margin:0;flex:1}
.notice button{appearance:none;border:0;border-radius:10px;background:var(--warn-ink);color:#fff;font:inherit;font-weight:700;font-size:14px;padding:9px 12px;white-space:nowrap}
.notice.soft{background:var(--green-soft);color:#24533D}

.compass{display:flex;flex-direction:column;align-items:center;margin:6px 0 12px}
#dial{width:min(72vw,36vh,300px);aspect-ratio:1;height:auto;display:block;overflow:visible}
.turn{font-size:23px;font-weight:800;margin-top:4px;min-height:32px;text-align:center}
.turn.ok{color:var(--green)}
.bear{font-size:13px;color:var(--muted);min-height:18px;text-align:center}

.places{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.place{display:flex;gap:12px;padding:12px 14px;align-items:flex-start}
.place+.place{border-top:1px solid var(--line)}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:2px}
.ic svg{width:18px;height:18px}
.ic.here{background:#E1ECF7;color:#2D69A8}
.ic.home{background:#FBE4DB;color:var(--arrow-dark)}
.place .txt{min-width:0;flex:1}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.addr{font-size:16px;font-weight:600;line-height:1.45;word-break:normal;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}
.addr.wait{color:#A9A394;font-weight:500}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.credit{text-align:center;font-size:11px;color:var(--muted);margin:16px 0 6px;letter-spacing:.04em}

.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 78%,rgba(243,238,226,0))}
.bar .row{max-width:480px;margin:0 auto;display:flex;gap:10px}
.btn{appearance:none;border:0;border-radius:16px;font:inherit;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;min-height:62px;cursor:pointer}
.btn svg{flex:none}
.btn.main{flex:1;background:var(--green);color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(47,107,79,.28)}
.btn.main:active{background:var(--green-press);transform:translateY(1px)}
.btn.walk{width:92px;background:var(--card);color:var(--green);border:2px solid var(--green);font-size:14px;flex-direction:column;gap:1px}
.btn.walk:active{background:var(--green-soft)}

/* ===== 到着のお祝い ===== */
#party{position:fixed;inset:0;z-index:50;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,#FFF4C2 0%,#F8C64A 30%,#E8562E 68%,#B3121B 100%);
  animation:partyIn .25s ease-out both}
#party.out{animation:partyOut .55s ease-in both}
@keyframes partyIn{from{opacity:0}to{opacity:1}}
@keyframes partyOut{to{opacity:0}}
#party .rays{position:absolute;left:50%;top:42%;width:240vmax;height:240vmax;margin:-120vmax 0 0 -120vmax;
  background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.34) 0deg 9deg,rgba(255,255,255,0) 9deg 18deg);
  -webkit-mask:radial-gradient(circle,#000 0%,#000 18%,transparent 52%);mask:radial-gradient(circle,#000 0%,#000 18%,transparent 52%);
  animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#party .flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .7s ease-out both}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
#confetti{position:absolute;inset:0;pointer-events:none}
#party .inner{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 12px;margin-top:-6vh}
#party .jingi{font-size:min(11.5vw,66px);font-weight:900;white-space:nowrap;color:#FFF7CF;letter-spacing:.02em;line-height:1.2;
  text-shadow:
    3px 0 0 #8E0E14,-3px 0 0 #8E0E14,0 3px 0 #8E0E14,0 -3px 0 #8E0E14,
    2px 2px 0 #8E0E14,-2px 2px 0 #8E0E14,2px -2px 0 #8E0E14,-2px -2px 0 #8E0E14,
    0 7px 0 #5C070C,0 12px 18px rgba(80,0,0,.45);
  animation:pop .9s cubic-bezier(.2,1.6,.4,1) both,wobble 1.1s ease-in-out .9s infinite}
@keyframes pop{0%{transform:scale(.15) rotate(-24deg);opacity:0}60%{transform:scale(1.18) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-6deg)}}
@keyframes wobble{0%,100%{transform:scale(1) rotate(-6deg)}25%{transform:scale(1.07) rotate(-3deg)}50%{transform:scale(1) rotate(-7deg)}75%{transform:scale(1.07) rotate(-4deg)}}
#party .jwrap{position:relative}
#party .pclose{position:absolute;top:-50px;right:-12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;padding:0;
  appearance:none;border:3px solid #F6C343;background:#fff;color:#A3121B;box-shadow:0 4px 10px rgba(80,0,0,.35);cursor:pointer;z-index:2;
  animation:closeIn .35s cubic-bezier(.3,1.6,.5,1) .5s both}
#party .pclose:active{transform:scale(.92)}
@keyframes closeIn{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}
#party .pgoat{width:min(44vw,190px);height:auto;margin-top:6px;filter:drop-shadow(0 10px 12px rgba(90,10,0,.35));
  animation:goatIn .7s cubic-bezier(.3,1.5,.5,1) .25s both,hop .62s cubic-bezier(.3,0,.5,1) 1s infinite alternate}
@keyframes goatIn{from{transform:translateY(60vh) rotate(25deg)}to{transform:translateY(0) rotate(0)}}
@keyframes hop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-26px) rotate(4deg)}}
#party .psub{margin-top:10px;font-size:20px;font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(120,10,10,.55);animation:fadeUp .5s ease-out .7s both}
#party .tap{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:12px;color:rgba(255,255,255,.85);animation:fadeUp .5s ease-out 1.6s both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#logo{cursor:pointer}

/* ===== 到着ボタン（90m以内） ===== */
body.near{padding-bottom:calc(178px + env(safe-area-inset-bottom))}
.btn.arrive{width:100%;max-width:480px;margin:0 auto 10px;min-height:66px;gap:10px;color:#fff;font-size:24px;letter-spacing:.06em;
  background:linear-gradient(180deg,#F04A35 0%,#C81E26 100%);border:3px solid #F6C343;
  box-shadow:0 6px 18px rgba(200,30,38,.38);animation:arriveIn .45s cubic-bezier(.3,1.5,.5,1) both,glow 1.6s ease-in-out .5s infinite}
.btn.arrive svg{width:46px;height:46px;flex:none;margin:-6px 0 -6px -6px;filter:drop-shadow(0 2px 2px rgba(80,0,0,.3))}
.btn.arrive span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.btn.arrive small{font-size:11px;font-weight:700;letter-spacing:0;opacity:.9;margin-top:3px}
.btn.arrive:active{transform:translateY(1px) scale(.99)}
@keyframes arriveIn{from{transform:translateY(30px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 6px 18px rgba(200,30,38,.38),0 0 0 0 rgba(246,195,67,.0)}50%{box-shadow:0 6px 18px rgba(200,30,38,.38),0 0 0 7px rgba(246,195,67,.45)}}

/* ===== 行き先の登録 ===== */
input,textarea{-webkit-user-select:text;user-select:text}
.homecard{display:flex;align-items:center;gap:6px}
.chg{margin-left:auto;appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--green);font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px;flex:none}
#setup{position:fixed;inset:0;z-index:40;background:rgba(30,40,34,.5);display:flex;align-items:flex-end;justify-content:center}
#setup .sheet{width:100%;max-width:520px;max-height:94vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.18);animation:sheetUp .28s ease-out both}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.sh-head svg{width:52px;height:52px;flex:none;margin:-4px 0 0 -6px}
.sh-head h2{margin:0 0 2px;font-size:20px;font-weight:800}
.sh-head p{margin:0;font-size:13px;line-height:1.55;color:var(--muted)}
.f{display:block;margin:10px 0}
.f span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.f input,.f textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;resize:none;outline:none}
.f input:focus,.f textarea:focus{border-color:var(--green)}
.btn2{appearance:none;width:100%;min-height:52px;border-radius:14px;font:inherit;font-size:17px;font-weight:800;border:2px solid var(--green);background:var(--card);color:var(--green);margin-top:6px}
.btn2.primary{background:var(--green);color:#fff}
.btn2.ghost{border-color:transparent;color:var(--muted);font-weight:700;font-size:15px;min-height:44px}
.btn2:disabled{opacity:.55}
.found{background:var(--green-soft);border-radius:14px;padding:12px 14px;margin-top:10px}
.found-t{font-size:12px;font-weight:700;color:#24533D}
.found-a{font-size:17px;font-weight:700;line-height:1.45;margin:2px 0}
.found-m{font-size:13px;color:#3C5A48;line-height:1.5}
.found-m b{color:#9A4A00}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 6px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.hint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;min-height:18px}
.err{background:#FDE3DC;color:#8A2410;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.5}
</style>
</head>

<script>
"use strict";
// ===== 行き先（このスマホの中だけに保存） =====
// D = { name, addr, lat, lon, src: "addr" | "here", acc }
let D = null;
const ARRIVE_M = 40;          // これより近ければ自動で「到着」
const BTN_M = 90;             // これより近ければ「到着！」ボタンを出す（GPSがズレても押せば到着）
const BTN_HIDE_M = 110;       // 出したボタンは、これより離れたら引っこめる
const LEAVE_M = 150;          // 到着のあと、これより離れたら「到着」をやめて、次に着いたときまたお祝いする
const NEAR_M = 300;           // これより近ければ「もうすぐ」

const $ = (id) => document.getElementById(id);
const native = window.Android || null;
const DEST_KEY = "itsuki.dest";
function loadDest() {

// ===== 距離と方角（WGS84 楕円体・Vincenty法） =====
function inverse(lat1, lon1, lat2, lon2) {
  const a = 6378137, f = 1 / 298.257223563, b = a * (1 - f), r = Math.PI / 180;
  const L = (lon2 - lon1) * r;
  const U1 = Math.atan((1 - f) * Math.tan(lat1 * r)), U2 = Math.atan((1 - f) * Math.tan(lat2 * r));
  const sU1 = Math.sin(U1), cU1 = Math.cos(U1), sU2 = Math.sin(U2), cU2 = Math.cos(U2);
  let lam = L, lamP, it = 0, sL, cL, sS, cS, sig, sA, c2A, c2M, C;
  do {
    sL = Math.sin(lam); cL = Math.cos(lam);
    const t1 = cU2 * sL, t2 = cU1 * sU2 - sU1 * cU2 * cL;
    sS = Math.sqrt(t1 * t1 + t2 * t2);
    if (sS === 0) return { dist: 0, bearing: 0 };
    cS = sU1 * sU2 + cU1 * cU2 * cL;
    sig = Math.atan2(sS, cS);
    sA = cU1 * cU2 * sL / sS;
    c2A = 1 - sA * sA;
    c2M = c2A !== 0 ? cS - 2 * sU1 * sU2 / c2A : 0;
    C = f / 16 * c2A * (4 + f * (4 - 3 * c2A));
    lamP = lam;
    lam = L + (1 - C) * f * sA * (sig + C * sS * (c2M + C * cS * (-1 + 2 * c2M * c2M)));
  } while (Math.abs(lam - lamP) > 1e-12 && ++it < 200);
  if (it >= 200) { // 収束しないとき（地球の反対側など）は球で近似
    const R = 6371008.8, dφ = (lat2 - lat1) * r, dλ = L;
    const h = Math.sin(dφ / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dλ / 2) ** 2;
    const y = Math.sin(dλ) * Math.cos(lat2 * r), x = Math.cos(lat1 * r) * Math.sin(lat2 * r) - Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos(dλ);
    return { dist: 2 * R * Math.asin(Math.sqrt(h)), bearing: (Math.atan2(y, x) / r + 360) % 360 };
  }
  const uSq = c2A * (a * a - b * b) / (b * b);
  const A = 1 + uSq / 16384 * (4096 + uSq * (-768 + uSq * (320 - 175 * uSq)));
  const B = uSq / 1024 * (256 + uSq * (-128 + uSq * (74 - 47 * uSq)));

  if (res) {

    } else {

  else if (S.status === "perm-denied" || S.status === "perm-blocked") gps.textContent = "未許可";
  else if (!fix) gps.textContent = "GPS探索中";

// ===== お祝い（ｼﾞﾝｷﾞｽｶ-ﾝ！！！） =====
const confetti = (() => {
  const cv = $("confetti"), ctx = cv.getContext("2d");
  const COLORS = ["#E8382F", "#FFFFFF", "#F6C343", "#FFE27A", "#FFFFFF", "#D81E2A", "#2F9E5B", "#F28AA0"];
  let parts = [], raf = 0, start = 0, W = 0, H = 0, timers = [];
  const rnd = (a, b) => a + Math.random() * (b - a);

    const dpr = Math.min(2, window.devicePixelRatio || 1);

  }

    const x = fromLeft ? -10 : W + 10;

  function firework() {
    const x = rnd(W * .15, W * .85), y = rnd(H * .08, H * .36), c = SPARK[Math.random() * SPARK.length | 0], n = 56;
    for (let i = 0; i < n; i++) {

        p.px = p.x; p.py = p.y; p.x += p.vx; p.y += p.vy;
        const left = 1 - p.life / p.max;

      timers.push(setTimeout(() => { cannon(true); cannon(false); }, 1600));

    stop() { cancelAnimationFrame(raf); raf = 0; timers.forEach(clearTimeout); timers = []; parts = []; ctx.clearRect(0, 0, cv.width, cv.height); },

    });
  }
  return fetch("https://msearch.gsi.go.jp/address-search/AddressSearch?q=" + encodeURIComponent(q))
    .then((r) => r.json())
    .then((a) => a && a.length ? { lat: a[0].geometry.coordinates[1], lon: a[0].geometry.coordinates[0], title: a[0].properties.title, src: "gsi" } : null)
    .catch(() => null);
}
function candidates(q) {
  q = halfWidth(q).replace(/\s+/g, " ").trim();
  const noBuilding = q.replace(/^(.*?\d[\d-]*)[\s　].*$/, "$1");     // 番地のあとの建物名を外す
  const noBranch = noBuilding.replace(/^(.*?\d+)-[\d-]+$/, "$1");      // 12-3 → 12
  return [...new Set([noBuilding, q, noBranch])].filter(Boolean);
}
$("fSearch").onclick = async () => {
  const q = $("fAddr").value.trim();
  setupErr("");
  if (!q) { setupErr("住所を入れてください。"); return; }
  const btn = $("fSearch");
  btn.disabled = true; btn.textContent = "探しています…";
  let r = null;
  for (const c of candidates(q)) { r = await geocodeOne(c); if (r) break; }
  btn.disabled = false; btn.textContent = "この住所で探す";
  if (!r) { found = null; $("found").hidden = true; setupErr("住所から場所が見つかりませんでした。行き先にいるときに「今いる場所を登録する」を使ってください。"); return; }
  found = { lat: r.lat, lon: r.lon, title: halfWidth(r.title || q) };
  $("foundAddr").textContent = found.title;
  let m = r.src === "gsi" ? "国土地理院の住所検索で見つけた位置です。" : "地図の住所検索で見つけた位置です。";
  if (S.fix) m += `今いる場所から ${fmtKm(inverse(S.fix.lat, S.fix.lon, found.lat, found.lon).dist)} km。`;
  const nums = (halfWidth(q).match(/\d+/g) || []);
  if (nums.length && !nums.some((n) => found.title.includes(n))) m += "<br><b>番地までは見つからなかったかもしれません。</b>着いたときに「今いる場所を登録する」で登録し直すと正確です。";
  $("foundMeta").innerHTML = m;
  $("found").hidden = false;
};
$("fSaveFound").onclick = () => {
  if (!found) return;
  applyDest({ name: nameOr(), addr: $("fAddr").value.trim() || found.title, lat: found.lat, lon: found.lon, src: "addr" });
};
$("fHere").onclick = () => {
  const fix = S.fix;
  if (!fix) return;
  applyDest({ name: nameOr(), addr: S.addr || `${fix.lat.toFixed(5)}, ${fix.lon.toFixed(5)}`, lat: fix.lat, lon: fix.lon, src: "here", acc: Math.round(fix.acc) });
};
$("fCancel").onclick = closeSetup;
$("chg").onclick = openSetup;

// ===== ボタン =====
$("arriveBtn").onclick = () => {
  if (!S.btn) return;
  S.arrived = true; S.armed = false; S.btn = false;
  celebrate();
  render();
};
function openNavi(mode) {
  if (!D) { openSetup(); return; }
  if (native) { native.openNavi(mode); return; }
  const tm = mode === "w" ? "walking" : "driving";
  location.href = `https://www.google.com/maps/dir/?api=1&destination=${D.lat},${D.lon}&travelmode=${tm}`;
}
$("navi").onclick = () => openNavi("d");
$("walk").onclick = () => openNavi("w");

let iosNeedsPermission = !native && window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function";
setInterval(() => { render(); setupTick(); }, 1000);
showDest();
render();
if (!D) openSetup();

// ===== ブラウザで開いたとき（アプリ外）の予備 =====
if (native) {
  native.ready();
} else if (!window.__TEST__) {
  if (navigator.geolocation) {
    S.status = "searching";
    navigator.geolocation.watchPosition(
      (p) => onFix(p.coords.latitude, p.coords.longitude, p.coords.accuracy, "gps", p.timestamp),
      (e) => onStatus(e.code === 1 ? "perm-denied" : "searching"),
      { enableHighAccuracy: true, maximumAge: 0 });
  }
  // 現在地の住所（国土地理院）。市区町村名の表を読み込んでから使う
  window.GSI = window.GSI || {};
  const sc = document.createElement("script");
  sc.src = "https://maps.gsi.go.jp/js/muni.js";
  document.head.appendChild(sc);
  let lastRev = null, lastRevAt = 0;
  setInterval(() => {
    const f = S.fix;
    if (!f || Date.now() - lastRevAt < 15000) return;
    if (lastRev && inverse(lastRev.lat, lastRev.lon, f.lat, f.lon).dist < 25) return;
    lastRevAt = Date.now(); lastRev = { lat: f.lat, lon: f.lon };
    fetch(`https://mreversegeocoder.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat=${f.lat}&lon=${f.lon}`)
      .then((r) => r.json())
      .then((j) => {
        const res = j && j.results; if (!res) return onAddress("");
        const tbl = (window.GSI && GSI.MUNI_ARRAY) || {};
        const row = tbl[res.muniCd] || tbl[String(res.muniCd).replace(/^0+/, "")];
        const parts = row ? row.split(",") : [];
        onAddress((parts[1] || "") + (parts[3] || "").replace(/\s|　/g, "") + (res.lv01Nm && res.lv01Nm !== "－" ? res.lv01Nm : "") + "付近");
      })
      .catch(() => onAddress(""));
  }, 2000);
  window.addEventListener("deviceorientationabsolute", (e) => { if (e.alpha != null) onHeading((360 - e.alpha) % 360, 3); });
  window.addEventListener("deviceorientation", (e) => { if (e.webkitCompassHeading != null) onHeading(e.webkitCompassHeading, 3); });
}
</script>
