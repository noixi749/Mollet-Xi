<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>マミー会ローリング・ストーンズ</title>
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#fff;--fg:#111;--sub:#777;--line:#ccc;--btn:#f2f2f2;--stage:#555;--win:#c00;--lose:#04c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button{font:inherit;color:var(--fg);background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:12px 14px;touch-action:manipulation;cursor:pointer}
button:active{background:#e2e2e2}
button:disabled{opacity:.4}
input[type=text]{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:6px}
.screen{height:100%;display:flex;flex-direction:column}
.pad{padding:16px max(16px,env(safe-area-inset-left,0px)) 16px max(16px,env(safe-area-inset-right,0px));overflow:auto}
.col{display:flex;flex-direction:column;gap:10px;max-width:420px;width:100%;margin:0 auto}
h1{font-size:22px;margin:24px 0 2px;line-height:1.3}
.sub{color:var(--sub);font-size:13px}
.credit{color:var(--sub);font-size:12px;margin-top:20px}
.msg{min-height:1.4em;font-size:14px}
/* game */
#bar{display:flex;align-items:center;gap:8px;height:44px;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
#bar button{padding:6px 10px}
#turn{flex:1;text-align:center;font-weight:bold}
#count{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
#stageWrap{flex:1;position:relative;min-height:0;display:flex;justify-content:center}
#cv{display:block;touch-action:none;height:100%;width:100%;max-width:520px}
#ctl{display:flex;gap:10px;padding:10px max(10px,env(safe-area-inset-right,0px)) 12px max(10px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);max-width:520px;width:100%;margin:0 auto}
#ctl button{flex:1;padding:16px 0;font-size:18px}
#hint{position:absolute;left:0;right:0;top:8px;text-align:center;color:var(--sub);font-size:13px;pointer-events:none}
#result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.75)}
#result .box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:240px;text-align:center}
#resBig{font-size:34px;font-weight:bold;letter-spacing:1px}
#resBig.win{color:var(--win)}#resBig.lose{color:var(--lose)}
#resSub{white-space:pre-line;font-variant-numeric:tabular-nums}
/* creator */
#edWrap{position:relative;width:100%;max-width:300px;margin:0 auto;aspect-ratio:1}
#ed{width:100%;height:100%;display:block;touch-action:none;border:1px solid var(--line);border-radius:6px;background:#eee}
.shapes{display:flex;flex-wrap:wrap;gap:6px}
.shapes button{padding:8px 10px;font-size:14px}
.shapes button.on{background:#111;color:#fff;border-color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.cell{position:relative;border:1px solid var(--line);border-radius:6px;padding:4px;text-align:center;font-size:11px;color:var(--sub);min-width:0}
.cell img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.cell .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell button{position:absolute;top:-6px;right:-6px;padding:0;width:24px;height:24px;border-radius:12px;font-size:12px;line-height:1;background:#fff}
.cell button.sure{width:auto;padding:0 6px;background:#c00;color:#fff;border-color:#c00}
label.file{display:block}
label.file input{display:none}
label.file span{display:block;text-align:center;background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:12px}
input[type=range]{width:100%}
.tblWrap{overflow-x:auto}
#rkTable{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
#rkTable th,#rkTable td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
#rkTable th{font-size:12px;color:var(--sub);font-weight:normal}
#rkTable td.num,#rkTable th.num{text-align:right}
#rkTable td.nm{white-space:normal;word-break:break-all}
#rkTable tr.me td{font-weight:bold}
</style>
</head>
<body>
<div id="loading" class="screen pad"><div class="col"><p>読み込み中…</p></div></div>

<!-- title -->
<div id="sTitle" class="screen pad" hidden>
  <div class="col">
    <h1>マミー会ローリング・ストーンズ</h1>
    <div class="sub">顔面を積んで、落とした方の負け</div>
    <div class="sub" id="charCount"></div>
    <div class="sub" id="meLine"></div>
    <button id="bSolo">ひとりで</button>
    <button id="bLocal">ふたりで（1台を交代で）</button>
    <button id="bOnline">合言葉で対戦</button>
    <button id="bRank">ランキング</button>
    <button id="bCreate">キャラ作成</button>
    <details id="srvBox" class="sub">
      <summary id="srvState">サーバー</summary>
      <div class="col" style="margin-top:8px">
        <input type="text" id="srvUrl" placeholder="https://〜.firebasedatabase.app" autocomplete="off" inputmode="url">
        <button id="bSrvSave" type="button">サーバーを保存</button>
        <div class="msg" id="srvMsg"></div>
      </div>
    </details>
    <div class="credit">製作：Naohisa Akiyama</div>
  </div>
</div>

<!-- online lobby -->
<div id="sLobby" class="screen pad" hidden>
  <div class="col">
    <h1>合言葉で対戦</h1>
    <div class="sub">友達と同じ合言葉を入れたら対戦開始。お互いの作ったキャラとランキングも自動で共有されるで。</div>
    <input type="text" id="pname" maxlength="12" placeholder="あなたの名前（ランキングに出る）" autocomplete="off">
    <input type="text" id="word" maxlength="40" placeholder="合言葉（例：まみー）" autocomplete="off">
    <button id="bJoin">入る</button>
    <div class="msg" id="lobbyMsg"></div>
    <button id="bLobbyBack">戻る</button>
  </div>
</div>

<!-- game -->
<div id="sGame" class="screen" hidden>
  <div id="bar"><button id="bQuit" aria-label="やめる">✕</button><div id="turn"></div><div id="count"></div></div>
  <div id="stageWrap">
    <canvas id="cv"></canvas>
    <div id="hint">左右にドラッグで移動</div>
    <div id="result" hidden><div class="box">
      <div id="resBig"></div><div id="resSub"></div>
      <button id="bAgain">もう一回</button>
      <button id="bToTitle">タイトルへ</button>
    </div></div>
  </div>
  <div id="ctl"><button id="bRot">↻ 回転</button><button id="bDrop">落とす</button></div>
</div>

<!-- ranking -->
<div id="sRank" class="screen pad" hidden>
  <div class="col">
    <h1>ランキング</h1>
    <div class="shapes"><button id="rkRate" type="button" class="on">レート</button><button id="rkSolo" type="button">ひとりで最高</button></div>
    <div class="tblWrap"><table id="rkTable"></table></div>
    <div class="sub">合言葉で対戦するたびに、相手が知ってるみんなの記録も集まってくるで。レートは1500から、勝つと上がって負けると下がる。</div>
    <button id="bRankBack">戻る</button>
  </div>
</div>

<!-- creator -->
<div id="sCreate" class="screen pad" hidden>
  <div class="col">
    <h1>キャラ作成</h1>
    <label class="file"><input type="file" id="file" accept="image/*"><span>写真を選ぶ</span></label>
    <div id="edWrap"><canvas id="ed" width="600" height="600"></canvas></div>
    <div class="sub">写真をドラッグで位置、2本指かスライダーで大きさ</div>
    <input type="range" id="zoom" min="-2.5" max="2.5" step="0.01" value="0" aria-label="大きさ">
    <div class="shapes" id="shapes"></div>
    <input type="text" id="cname" maxlength="16" placeholder="名前（なくてもOK）" autocomplete="off">
    <button id="bSave" disabled>保存してキャラに追加</button>
    <div class="msg" id="createMsg"></div>
    <div class="sub" id="myCount"></div>
    <div class="grid" id="myList"></div>
    <button id="bCreateBack">戻る</button>
  </div>
</div>

  if(merge)o[k]=mergeInto(o[k],data);else if(data===null)delete o[k];else o[k]=data;
  return root;
}
let srvSyncing=false;

/* ================= profile / rating table ================= */
let me=lsGet('mrs-me',null);
if(!me||typeof me.id!=='string'){me={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),name:''};lsSet('mrs-me',me);}
let table=lsGet('mrs-table',{});if(typeof table!=='object'||!table)table={};
const RATE0=1500,ELO_K=32;
function myRec(){let r=table[me.id];if(!r){r={id:me.id,name:me.name||'ななし',rating:RATE0,w:0,l:0,best:0,v:0,at:Date.now()};table[me.id]=r;}return r;}
function saveTable(){lsSet('mrs-table',table);pushMyRec();}
function bump(r){r.v=(r.v|0)+1;r.at=Date.now();}
function validRec(r){return r&&typeof r.id==='string'&&/^p[a-z0-9]{4,30}$/.test(r.id)&&typeof r.name==='string'&&r.name.length<=16&&isFinite(r.rating)&&Math.abs(r.rating)<1e5&&Number.isInteger(r.w)&&r.w>=0&&Number.isInteger(r.l)&&r.l>=0&&Number.isInteger(r.best)&&r.best>=0&&Number.isInteger(r.v)&&r.v>=0&&isFinite(r.at);}
function cleanRec(r){return {id:r.id,name:r.name,rating:Math.round(r.rating),w:r.w,l:r.l,best:r.best,v:r.v,at:r.at};}
function mergeRec(r){if(!validRec(r))return;const c=table[r.id];if(!c||r.v>c.v||(r.v===c.v&&r.at>c.at))table[r.id]=cleanRec(r);}
function setMyName(n){n=(n||'').trim().slice(0,12)||'ななし';me.name=n;lsSet('mrs-me',me);const r=myRec();if(r.name!==n){r.name=n;bump(r);saveTable();}}
function applyElo(recs,loser){ // recs: [player0 rec, player1 rec] as of game start
  const [a,b]=recs;const ea=1/(1+Math.pow(10,(b.rating-a.rating)/400));const sa=loser===0?0:1;
  const d=Math.round(ELO_K*(sa-ea));const now=Date.now();
  mergeRec(Object.assign({},a,{rating:a.rating+d,w:a.w+sa,l:a.l+(1-sa),v:a.v+1,at:now}));
  mergeRec(Object.assign({},b,{rating:b.rating-d,w:b.w+(1-sa),l:b.l+sa,v:b.v+1,at:now}));
  saveTable();return d;
}

/* ================= characters ================= */
const CH=new Map();   // id -> char
const SCALE_HEAD=0.62;
let TARGET_AREA=4600;
function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const q=p[i],r=p[(i+1)%p.length];a+=q[0]*r[1]-r[0]*q[1];}return Math.abs(a)/2;}
function loadImg(src){return new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src;});}
async function registerChar(c,builtin){
  const area=c.parts.reduce((s,p)=>s+polyArea(p),0);
  const scale=c.scale||Math.sqrt(TARGET_AREA/Math.max(area,1));
  const image=await loadImg(c.img);
  if(!image)return false;
  // radius from centroid-ish (image center) for spawn spacing
  let r=0;for(const p of c.parts)for(const [x,y] of p)r=Math.max(r,Math.hypot(x-c.w/2,y-c.h/2)*scale);
  CH.set(c.id,{id:c.id,name:c.name||'',w:c.w,h:c.h,parts:c.parts,img:c.img,image,scale,radius:r,builtin:!!builtin,mine:!!c.mine,raw:c});
  return true;
}
function customIds(){return [...CH.values()].filter(c=>!c.builtin&&!blocked.has(c.id)).map(c=>c.id);}
function allIds(){return [...CH.values()].filter(c=>!blocked.has(c.id)).map(c=>c.id);}
function validChar(c){
  if(!c||typeof c.id!=='string'||!/^[a-z0-9_-]{2,40}$/i.test(c.id))return false;
  if(typeof c.img!=='string'||!/^data:image\/(webp|png|jpeg);base64,/.test(c.img)||c.img.length>3e6)return false;
  if(!(c.w>0&&c.w<=2000&&c.h>0&&c.h<=2000))return false;
  if(!Array.isArray(c.parts)||c.parts.length<1||c.parts.length>12)return false;
  for(const p of c.parts){if(!Array.isArray(p)||p.length<3||p.length>48)return false;for(const v of p)if(!Array.isArray(v)||!isFinite(v[0])||!isFinite(v[1]))return false;}
  if(c.name!=null&&(typeof c.name!=='string'||c.name.length>16))return false;
  return true;
}
function sendable(c){return {id:c.id,name:c.name,w:c.w,h:c.h,parts:c.parts,img:c.img};}

/* ================= shapes (unit square) ================= */
function regPoly(n,r0){const a=[];for(let i=0;i<n;i++)a.push([.5+.5*Math.cos(r0+2*Math.PI*i/n),.5+.5*Math.sin(r0+2*Math.PI*i/n)]);return a;}
function starDef(){const R=.5,ri=.5*.52,c=[.5,.53],o=[],n=[];for(let i=0;i<5;i++){const a=-Math.PI/2+2*Math.PI*i/5,b=a+Math.PI/5;o.push([c[0]+R*Math.cos(a),c[1]+R*Math.sin(a)]);n.push([c[0]+ri*Math.cos(b),c[1]+ri*Math.sin(b)]);}
  const outline=[];for(let i=0;i<5;i++)outline.push(o[i],n[i]);const parts=[n.slice()];for(let i=0;i<5;i++)parts.push([o[i],n[i],n[(i+4)%5]]);return {outline,parts};}
const SHAPES=(()=>{const s={};
  const add=(k,label,outline,parts)=>s[k]={label,outline,parts:parts||[outline]};
  add('circle','丸',regPoly(20,0));
  add('square','四角',[[.02,.02],[.98,.02],[.98,.98],[.02,.98]]);
  add('tri','三角',[[.5,.03],[.98,.92],[.02,.92]]);
  add('itri','逆三角',[[.02,.08],[.98,.08],[.5,.97]]);
  const st=starDef();add('star','星',st.outline,st.parts);
  add('diamond','ひし形',[[.5,.01],[.99,.5],[.5,.99],[.01,.5]]);
  add('hex','六角',regPoly(6,0));
  return s;})();

/* ================= physics world ================= */
const WW=420, STAGE_L=85, STAGE_R=335, STAGE_H=60, FALL_Y=300, STEP=1000/60;
let engine, stageBody;
function newEngine(){
  engine=Engine.create({positionIterations:10,velocityIterations:8,enableSleeping:false});
  engine.gravity.y=1;
  stageBody=Bodies.rectangle((STAGE_L+STAGE_R)/2,STAGE_H/2,STAGE_R-STAGE_L,STAGE_H,{isStatic:true,friction:1,frictionStatic:2});
  Composite.add(engine.world,stageBody);
}
function makeBody(cid,x,y,a){
  const c=CH.get(cid);const s=c.scale;
  const opt={friction:0.9,frictionStatic:1.6,restitution:0.02,density:0.0015,frictionAir:0.012};
  const parts=c.parts.map(p=>{let v=p.map(q=>({x:q[0]*s,y:q[1]*s}));v=Vertices.clockwiseSort(v);return Body.create(Object.assign({position:Vertices.centre(v),vertices:v},opt));});
  const b=parts.length===1?parts[0]:Body.create(Object.assign({parts},opt));
  b.plugin={cid,off:{x:b.position.x,y:b.position.y}};
  Body.setPosition(b,{x,y});Body.setAngle(b,a);
  return b;
}
function pieces(){return Composite.allBodies(engine.world).filter(b=>b.plugin&&b.plugin.cid);}
function snapshot(){return pieces().map(b=>[b.plugin.cid,b.position.x,b.position.y,b.angle]);}
function applySnapshot(list){
  newEngine();
  for(const [cid,x,y,a] of list){if(CH.has(cid))Composite.add(engine.world,makeBody(cid,x,y,a));}
}
function towerTop(){let t=0;for(const b of pieces())if(b.position.y<FALL_Y-100)t=Math.min(t,b.bounds.min.y);return t;}

/* ================= game state ================= */
let G=null; // current game
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeSeq(pool,seed){const r=mulberry32(seed);const seq=[];return t=>{while(seq.length<=t){const bag=pool.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]];}seq.push(...bag);}return seq[t];};}

function startGame(o){
  // o: {mode:'solo'|'local'|'online', pool, seed, first, me}
  G={mode:o.mode,pool:o.pool,seq:makeSeq(o.pool,o.seed),t:0,first:o.first||0,me:o.me||0,phase:'aim',
     aimX:WW/2,aimA:0,dispA:0,spawnY:-220,cur:null,dropAt:0,calm:0,fell:false,fellAt:0,auth:true,waitSettle:false};
  newEngine();
  show('sGame');$('#result').hidden=true;$('#hint').hidden=false;
  camTop=null;resize();
  setupAim();
}
function curPlayer(){return (G.t+G.first)%2;}
function myTurn(){return G.mode!=='online'||curPlayer()===G.me;}
function setupAim(){
  G.phase='aim';G.cur=G.seq(G.t);G.aimX=WW/2;G.aimA=0;G.dispA=0;G.fell=false;G.waitSettle=false;
  const c=CH.get(G.cur);
  G.spawnY=Math.min(-200,towerTop()-c.radius-45);
  updateHud();
}
function updateHud(){
  const n=pieces().filter(b=>b.position.y<FALL_Y).length;
  $('#count').textContent=n+'個';
  let t='';
  if(G.mode==='solo')t='ひとりで';
  else if(G.mode==='local')t=(curPlayer()===0?'1P':'2P')+'の番';
  else t=myTurn()?'あなたの番':'相手の番';
  $('#turn').textContent=t;
  const can=G.phase==='aim'&&myTurn();
  $('#bRot').disabled=!can;$('#bDrop').disabled=!can;
}
function rotate(){if(!G||G.phase!=='aim'||!myTurn())return;G.aimA+=Math.PI/4;sendMove(true);}
function moveAim(x){G.aimX=Math.max(15,Math.min(WW-15,x));sendMove(false);}
function drop(){
  if(!G||G.phase!=='aim'||!myTurn())return;
  $('#hint').hidden=true;
  if(G.mode==='online')Net.send({t:'drop',n:G.t,x:G.aimX,y:G.spawnY,a:G.aimA});
  doDrop(G.aimX,G.spawnY,G.aimA,true);
}
function doDrop(x,y,a,auth){
  const b=makeBody(G.cur,x,y,a);
  Composite.add(engine.world,b);
  G.phase='fall';G.auth=auth;G.dropAt=simTime;G.calm=0;G.dispA=a;
  updateHud();
}
let simTime=0;
function afterStep(){
  if(!G||G.phase!=='fall')return;
  const ps=pieces();
  if(G.auth&&!G.fell&&ps.some(b=>b.position.y>FALL_Y)){G.fell=true;G.fellAt=simTime;}
  if(G.fell){if(simTime-G.fellAt>900)finishTurn(true);return;}
  const calm=ps.every(b=>b.speed<0.09&&b.angularSpeed<0.005);
  G.calm=calm?G.calm+1:0;
  const el=simTime-G.dropAt;
  if((el>450&&G.calm>=30)||el>7000){
    if(G.auth)finishTurn(false);
    else G.phase='wait'; // spectator: wait for authoritative result
  }
}
function finishTurn(fell){
  if(fell){
    if(G.mode==='online')Net.send({t:'settled',n:G.t,fell:true,snap:[]});
    gameOver(curPlayer());
    return;
  }
  const snap=snapshot();
  if(G.mode==='online')Net.send({t:'settled',n:G.t,fell:false,snap});
  applySnapshot(snap);
  G.t++;setupAim();
}
function remoteSettled(m){
  if(!G||m.n!==G.t)return;
  if(m.fell){gameOver(curPlayer());return;}
  applySnapshot(m.snap);
  G.t++;setupAim();
}
function gameOver(loser){
  G.phase='over';updateHud();
  const big=$('#resBig'),sub=$('#resSub');
  const n=G.t; // pieces stacked successfully before the fall
  if(G.mode==='solo'){
    const r=myRec(),best=r.best;
    if(n>best){r.best=n;bump(r);saveTable();big.textContent=WIN_TXT;big.className='win';sub.textContent='新記録 '+n+'個';}
    else{big.textContent=LOSE_TXT;big.className='lose';sub.textContent=n+'個（最高 '+best+'個）';}
  }else if(G.mode==='local'){
    const w=loser===0?'2P':'1P',l=loser===0?'1P':'2P';
    big.textContent=w+' '+WIN_TXT;big.className='win';sub.textContent=l+' '+LOSE_TXT+'（'+n+'個）';
  }else{
    const iWin=loser!==G.me;
    big.textContent=iWin?WIN_TXT:LOSE_TXT;big.className=iWin?'win':'lose';
    let t=(iWin?'あなたの勝ち':'あなたの負け')+'（'+n+'個）';
    if(G.recs&&!G.rated){G.rated=true;const before=G.recs[G.me].rating;const d=applyElo(G.recs,loser);const mine=G.me===0?d:-d;
      t+='\nレート '+before+' → '+(before+mine)+'（'+(mine>=0?'+':'')+mine+'）';}
    sub.textContent=t;
  }
  $('#bAgain').disabled=false;
  setTimeout(()=>{if(G&&G.phase==='over')$('#result').hidden=false;},300);
}

/* ================= rendering ================= */
const cv=$('#cv'),ctx=cv.getContext('2d');
let K=1,DPR=1,viewH=800,camTop=null;
function resize(){
  const r=cv.getBoundingClientRect();if(!r.width)return;
  DPR=Math.min(window.devicePixelRatio||1,3);
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);
  K=r.width/WW;viewH=r.height/K;
}
window.addEventListener('resize',resize);
function camTarget(){
  if(!G)return -viewH+110;
  const c=CH.get(G.cur);const rr=c?c.radius:60;
  return Math.min(G.spawnY-rr-50,110-viewH);
}
function drawChar(cid,x,y,a,alpha){
  const c=CH.get(cid);if(!c)return;
  // local centroid offset: compute once per char lazily
  if(!c.off){const tmp=makeBody(cid,0,0,0);c.off=tmp.plugin.off;}
  ctx.save();ctx.translate(x,y);ctx.rotate(a);if(alpha!=null)ctx.globalAlpha=alpha;
  ctx.drawImage(c.image,-c.off.x,-c.off.y,c.w*c.scale,c.h*c.scale);
  ctx.restore();
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  if(!G||!engine)return;
  const tgt=camTarget();camTop=camTop==null?tgt:camTop+(tgt-camTop)*0.08;
  ctx.setTransform(K*DPR,0,0,K*DPR,0,-camTop*K*DPR);
  // stage
  ctx.fillStyle='#555';ctx.fillRect(STAGE_L,0,STAGE_R-STAGE_L,STAGE_H);
  ctx.fillRect(STAGE_L+30,STAGE_H,STAGE_R-STAGE_L-60,400);
  for(const b of pieces()){const c=CH.get(b.plugin.cid);if(!c)continue;
    ctx.save();ctx.translate(b.position.x,b.position.y);ctx.rotate(b.angle);
    ctx.drawImage(c.image,-b.plugin.off.x,-b.plugin.off.y,c.w*c.scale,c.h*c.scale);ctx.restore();}
  if(G.phase==='aim'&&G.cur){
    G.dispA+=(G.aimA-G.dispA)*0.35;
    // guide line
    ctx.strokeStyle='#bbb';ctx.lineWidth=1/K;ctx.setLineDash([4/K,4/K]);
    ctx.beginPath();ctx.moveTo(G.aimX,G.spawnY);ctx.lineTo(G.aimX,camTop+viewH);ctx.stroke();ctx.setLineDash([]);
    drawChar(G.cur,G.aimX,G.spawnY,G.dispA);
  }
}
function loop(now){
  if(loop.last==null)loop.last=now;
  let dt=Math.min(100,now-loop.last);loop.last=now;
  if(G&&engine&&(G.phase==='fall')){
    loop.acc=(loop.acc||0)+dt;let n=0;
    while(loop.acc>=STEP&&n<6){Engine.update(engine,STEP);simTime+=STEP;afterStep();loop.acc-=STEP;n++;if(!G||G.phase!=='fall')break;}
    if(n>=6)loop.acc=0;
  }else loop.acc=0;
  draw();
  requestAnimationFrame(loop);
}

/* ================= input ================= */
let drag=null;
cv.addEventListener('pointerdown',e=>{if(!G||G.phase!=='aim'||!myTurn())return;cv.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,ax:G.aimX};});
cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||!G||G.phase!=='aim')return;moveAim(drag.ax+(e.clientX-drag.x)/K);});
const endDrag=e=>{if(drag&&drag.id===e.pointerId)drag=null;};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
$('#bRot').onclick=rotate;$('#bDrop').onclick=drop;
document.addEventListener('keydown',e=>{

/* ================= network ================= */
const PEER_URLS=['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function loadPeer(){if(window.peerjs||window.Peer)return true;for(const u of PEER_URLS){try{await loadScript(u);if(window.peerjs||window.Peer)return true;}catch(e){}}return false;}
function hashHex(str){const b=new TextEncoder().encode(str.trim());let h1=0x811c9dc5,h2=0x01000193^0x5bd1e995;for(const x of b){h1=Math.imul(h1^x,16777619);h2=Math.imul(h2^x,0x5bd1e995)^(h2>>>13);}return (h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0');}

const Net={role:null,conn:null,peer:null,tr:null,gen:0,
  send(m){try{this.tr&&this.tr.send(m);}catch(e){}},
  leave(){this.gen++;try{this.tr&&this.tr.close();}catch(e){}this.tr=null;this.role=null;Sync.reset();}
};
// transport: PeerJS (or a local test channel when the page is opened with #bctest-host / #bctest-guest)
async function makeTransport(word,h){
  const tm=/^#bctest-(host|guest)$/.exec(location.hash);
  if(tm)return bcTransport(tm[1],h);
  if(Srv.on())return srvTransport(word,h);
  h.status('接続中…');
  if(!await loadPeer()){h.error('通信の部品が読み込めへんかった。電波を確認してな');return null;}
  const PeerC=(window.peerjs&&window.peerjs.Peer)||window.Peer;
  const roomId='mummyrs-'+hashHex(word);
  let peer=null,conn=null,closed=false,tries=0,opened=false;
  const tr={send(m){if(conn&&conn.open)conn.send(m);},close(){closed=true;try{conn&&conn.close();}catch(e){}try{peer&&peer.destroy();}catch(e){}}};
  function hookConn(c,role){
    c.on('open',()=>{if(closed)return;if(conn&&conn!==c){c.close();return;}conn=c;opened=true;h.open(role);});
    c.on('data',d=>{if(!closed&&c===conn)h.data(d);});
    c.on('close',()=>{if(!closed&&c===conn)h.close();});
    c.on('error',()=>{});
  }
  function asHost(){
    if(closed)return;
    peer=new PeerC(roomId,{debug:0});
    peer.on('open',()=>{if(!opened)h.status('相手を待ってる…（同じ合言葉で入ってもらってな）');});
    peer.on('connection',c=>{if(conn){c.on('open',()=>{c.send({t:'full'});setTimeout(()=>c.close(),400);});return;}hookConn(c,'host');});
    peer.on('error',e=>{if(closed)return;
      if(e.type==='unavailable-id'&&!opened){try{peer.destroy();}catch(_){ }asGuest();}
      else if(!opened)h.error('つながらへんかった（'+e.type+'）');});
  }
  function asGuest(){
    if(closed)return;
    h.status('部屋に入ってる…');
    peer=new PeerC({debug:0});
    peer.on('open',()=>{const c=peer.connect(roomId,{reliable:true});hookConn(c,'guest');
      setTimeout(()=>{if(!opened&&!closed&&peer&&!peer.destroyed&&tries<3){tries++;try{peer.destroy();}catch(_){ }asHost();}},12000);});
    peer.on('error',e=>{if(closed)return;
      if(e.type==='peer-unavailable'&&!opened&&tries<3){tries++;try{peer.destroy();}catch(_){ }setTimeout(asHost,800+Math.random()*800);}
      else if(!opened)h.error('つながらへんかった（'+e.type+'）');});
  }
  asHost();
  return tr;
}
// Room on the server: two slots (a = host, b = guest). Each slot holds {info:{sid,at}, msgs:{<toSid>_<seq>: msg}}.
async function srvTransport(word,h){
  const room='rooms/'+hashHex(word);
  const sid='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const STALE=45000,TS={'.sv':'timestamp'};
  let slot=null,other=null,opp=null,closed=false,opened=false,off=0,seq=0,next=0,unlisten=null,hb=null,watch=null,mirror=null;
  const now=()=>Date.now()+off;
  const fresh=i=>i&&typeof i.sid==='string'&&typeof i.at==='number'&&now()-i.at<STALE;
  h.status('サーバーに接続中…');
  try{
    await Srv.put(room+'/t/'+sid,TS);const ts=await Srv.get(room+'/t/'+sid);if(typeof ts==='number')off=ts-Date.now();Srv.del(room+'/t/'+sid).catch(()=>{});
    for(const sl of ['a','b']){
      if(fresh(await Srv.get(room+'/'+sl+'/info')))continue;
      await Srv.put(room+'/'+sl,{info:{sid,at:TS}});
      await sleep(500+Math.random()*300);
      const chk=await Srv.get(room+'/'+sl+'/info');
      if(chk&&chk.sid===sid){slot=sl;break;}
    }
  }catch(e){h.error('サーバーにつながらへんかった。電波かサーバー設定を確認してな');return null;}
  if(!slot){h.error('その合言葉の部屋はもう2人おるで。別の合言葉にしてな');return null;}
  other=slot==='a'?'b':'a';
  h.status('相手を待ってる…（同じ合言葉で入ってもらってな）');
  const shut=()=>{if(closed)return;closed=true;unlisten&&unlisten();clearInterval(hb);clearInterval(watch);Srv.del(room+'/'+slot).catch(()=>{});};
  const lost=()=>{if(closed)return;shut();h.close();};
  unlisten=Srv.listen(room,m=>{
    if(closed)return;mirror=m||{};
    const mine=mirror[slot]&&mirror[slot].info;
    if(mine&&mine.sid!==sid){lost();return;}           // someone took our slot
    const o=mirror[other]||{};const oi=o.info;
    if(!opened){
      if(fresh(oi)&&oi.sid!==sid){opp=oi.sid;opened=true;h.open(slot==='a'?'host':'guest');}
      else return;
    }else if(!oi||oi.sid!==opp){lost();return;}       // opponent left
    const box=o.msgs||{};const pre=sid+'_';
    while(!closed){const k=pre+String(next).padStart(8,'0');if(!(k in box))break;next++;try{h.data(box[k]);}catch(e){console.error(e);}}
  });
  hb=setInterval(()=>{Srv.put(room+'/'+slot+'/info/at',TS).catch(()=>{});},8000);
  watch=setInterval(()=>{if(opened&&mirror){const oi=mirror[other]&&mirror[other].info;if(!fresh(oi))lost();}},5000);
  return {send(m){if(closed||!opened)return;const p=room+'/'+slot+'/msgs/'+opp+'_'+String(seq++).padStart(8,'0');
    Srv.put(p,m).catch(()=>sleep(700).then(()=>Srv.put(p,m)).catch(()=>sleep(2000).then(()=>Srv.put(p,m)).catch(()=>{})));},close:shut};
}
function bcTransport(role,h){
  const bc=new BroadcastChannel('mrs-test');let open=false,closed=false;
  bc.onmessage=e=>{const d=e.data;if(closed||d.from===role)return;
    if(d.k==='hi'){if(!open){open=true;bc.postMessage({from:role,k:'hi'});h.open(role);}}
    else if(d.k==='m'&&open)h.data(d.m);else if(d.k==='bye'&&open)h.close();};
  h.status('相手を待ってる…');
  bc.postMessage({from:role,k:'hi'});
  return {send(m){bc.postMessage({from:role,k:'m',m});},close(){closed=true;bc.postMessage({from:role,k:'bye'});bc.close();}};
}

/* ---- lobby / character sync ---- */
const Sync={pending:new Set(),total:0,peerReady:null,selfReady:false,
  reset(){this.pending=new Set();this.total=0;this.peerReady=null;this.selfReady=false;}};
let gameNo=0;
$('#bJoin').onclick=async()=>{
  const word=$('#word').value.trim();

  Net.leave();const gen=Net.gen;gameNo=0;
  $('#bJoin').disabled=true;
  const msg=t=>{if(gen===Net.gen)$('#lobbyMsg').textContent=t;};
  const tr=await makeTransport(word,{
    status:msg,
    error:t=>{msg(t);$('#bJoin').disabled=false;},
    open:role=>{if(gen!==Net.gen)return;Net.role=role;msg('つながった！キャラを共有中…');
      Net.send({t:'hello',v:1,ids:customIds(),me:me.id,table:Object.values(table).filter(validRec)});},
    data:m=>{if(gen===Net.gen)onNet(m);},
    close:()=>{if(gen!==Net.gen)return;
      if(!$('#sGame').hidden||!$('#sLobby').hidden){G=null;Net.leave();show('sLobby');$('#bJoin').disabled=false;$('#lobbyMsg').textContent='相手が抜けたで';}}
  });
  if(gen!==Net.gen){try{tr&&tr.close();}catch(e){}return;}
  Net.tr=tr;
};
function lobbyProgress(){
  if(!$('#sLobby').hidden){const got=Sync.total-Sync.pending.size;$('#lobbyMsg').textContent=Sync.total?('キャラ受け取り中… '+got+'/'+Sync.total):'準備中…';}
}
function checkReady(){
  if(Sync.pending.size)return;
  if(!Sync.selfReady){Sync.selfReady=true;Net.send({t:'ready',ids:customIds()});}
  if(Net.role==='host'&&Sync.peerReady&&gameNo===0)hostNewGame();
}
function hostNewGame(){
  const theirs=new Set(Sync.peerReady||[]);
  const pool=[...CH.values()].filter(c=>c.builtin||(theirs.has(c.id)&&!blocked.has(c.id))).map(c=>c.id).sort();
  const opp=table[Net.oppId]||{id:Net.oppId,name:'ななし',rating:RATE0,w:0,l:0,best:0,v:0,at:0};
  const m={t:'start',seed:(Math.random()*1e9)|0,pool,first:gameNo%2,no:gameNo,recs:[cleanRec(myRec()),cleanRec(opp)]};
  gameNo++;
  Net.send(m);beginOnline(m);
}
function beginOnline(m){
  const pool=m.pool.filter(id=>CH.has(id));
  if(pool.length!==m.pool.length){$('#lobbyMsg').textContent='キャラがそろってへん。入り直してな';return;}
  const recs=Array.isArray(m.recs)&&m.recs.length===2&&m.recs.every(validRec)?m.recs:null;
  startGame({mode:'online',pool,seed:m.seed,first:m.first,me:Net.role==='host'?0:1});
  G.recs=recs;G.rated=false;
  if(recs){const o=recs[1-G.me];$('#hint').textContent='相手：'+o.name+'（レート '+o.rating+'）';}
}
async function onNet(m){
  if(!m||typeof m.t!=='string')return;
  switch(m.t){
    case 'full':$('#lobbyMsg').textContent='その合言葉の部屋はもう2人おるで。別の合言葉にしてな';Net.leave();$('#bJoin').disabled=false;break;
    case 'hello':{
      if(typeof m.me==='string')Net.oppId=m.me;
      if(Array.isArray(m.table)){for(const r of m.table.slice(0,2000))if(!r||r.id!==me.id)mergeRec(r);saveTable();}
      const ids=Array.isArray(m.ids)?m.ids.filter(x=>typeof x==='string'):[];
      const need=ids.filter(id=>!CH.has(id)&&!blocked.has(id));
      Sync.pending=new Set(need);Sync.total=need.length;lobbyProgress();
      if(need.length)Net.send({t:'need',ids:need});
      checkReady();break;}
    case 'need':
      for(const id of (m.ids||[])){const c=CH.get(id);Net.send(c?{t:'char',c:sendable(c)}:{t:'char',miss:id});}
      break;
    case 'char':{
      if(m.miss){Sync.pending.delete(m.miss);}
      else if(validChar(m.c)&&!CH.has(m.c.id)){
        const c=Object.assign({},sendable(m.c),{from:'friend'});
        if(await registerChar(c,false))await Store.put(c);
        Sync.pending.delete(m.c.id);
      }else if(m.c&&m.c.id)Sync.pending.delete(m.c.id);
      lobbyProgress();checkReady();break;}
    case 'ready':Sync.peerReady=Array.isArray(m.ids)?m.ids:[];checkReady();break;
    case 'start':if(Net.role==='guest')beginOnline(m);break;
    case 'rematch':if(Net.role==='host'&&G&&G.phase==='over')hostNewGame();break;
    case 'move':if(G&&G.phase==='aim'&&!myTurn()&&m.n===G.t){G.aimX=+m.x||WW/2;G.aimA=+m.a||0;}break;
    case 'drop':if(G&&G.phase==='aim'&&!myTurn()&&m.n===G.t){$('#hint').hidden=true;G.spawnY=+m.y;doDrop(+m.x,+m.y,+m.a,false);}break;
    case 'settled':if(G&&!myTurn())remoteSettled(m);break;
  }
}

/* ================= creator ================= */
const ed=$('#ed'),ectx=ed.getContext('2d');
const OUT=220; // stored image size (px)
const E={img:null,shape:'circle',x:0,y:0,base:1,zl:0,ptrs:new Map(),pinch:null};
function edScale(){return E.base*Math.exp(E.zl);}
function shapePath(c,shape,size,ox,oy){const o=SHAPES[shape].outline;c.moveTo(ox+o[0][0]*size,oy+o[0][1]*size);for(let i=1;i<o.length;i++)c.lineTo(ox+o[i][0]*size,oy+o[i][1]*size);c.closePath();}
function drawPhoto(c,size){ // draws photo into a square of `size` px, centered transform
  if(!E.img)return;const s=edScale()*size/OUT;
  c.save();c.translate(size/2+E.x*size/OUT,size/2+E.y*size/OUT);c.scale(s,s);c.drawImage(E.img,-E.img.width/2,-E.img.height/2);c.restore();
}
function drawEditor(){
  const S=ed.width;ectx.setTransform(1,0,0,1,0,0);ectx.fillStyle='#eee';ectx.fillRect(0,0,S,S);
  if(!E.img){ectx.fillStyle='#999';ectx.font='28px system-ui,sans-serif';ectx.textAlign='center';ectx.fillText('写真を選んでな',S/2,S/2);return;}
  drawPhoto(ectx,S);
  ectx.beginPath();ectx.rect(0,0,S,S);shapePath(ectx,E.shape,S,0,0);ectx.fillStyle='rgba(255,255,255,.72)';ectx.fill('evenodd');
  ectx.beginPath();shapePath(ectx,E.shape,S,0,0);ectx.strokeStyle='#111';ectx.lineWidth=2;ectx.stroke();
}
function buildShapeButtons(){
  const box=$('#shapes');box.innerHTML='';
  for(const k of Object.keys(SHAPES)){const b=document.createElement('button');b.textContent=SHAPES[k].label;b.type='button';
    b.className=k===E.shape?'on':'';b.onclick=()=>{E.shape=k;buildShapeButtons();drawEditor();};box.appendChild(b);}
}
$('#file').onchange=async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);const im=await loadImg(url);URL.revokeObjectURL(url);
  if(!im){$('#createMsg').textContent='その写真は読み込めへんかった';return;}
  // downscale big photos
  const mx=1400,r=Math.min(1,mx/Math.max(im.width,im.height));
  const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  E.img=c;E.base=OUT/Math.min(c.width,c.height);E.zl=0;E.x=0;E.y=0;$('#zoom').value=0;
  $('#bSave').disabled=false;$('#createMsg').textContent='';drawEditor();e.target.value='';
};
$('#zoom').oninput=e=>{E.zl=+e.target.value;drawEditor();};
function edPos(e){const r=ed.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*OUT,y:(e.clientY-r.top)/r.height*OUT};}
ed.addEventListener('pointerdown',e=>{if(!E.img)return;ed.setPointerCapture(e.pointerId);E.ptrs.set(e.pointerId,edPos(e));E.pinch=null;});
ed.addEventListener('pointermove',e=>{
  if(!E.ptrs.has(e.pointerId))return;const p=edPos(e);const prev=E.ptrs.get(e.pointerId);
  if(E.ptrs.size===1){E.x+=p.x-prev.x;E.y+=p.y-prev.y;}
  E.ptrs.set(e.pointerId,p);
  if(E.ptrs.size>=2){const [a,b]=[...E.ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(E.pinch){E.zl=Math.max(-2.5,Math.min(2.5,E.zl+Math.log(d/E.pinch)));$('#zoom').value=E.zl;}E.pinch=d;}
  drawEditor();
});
const edUp=e=>{E.ptrs.delete(e.pointerId);E.pinch=null;};
ed.addEventListener('pointerup',edUp);ed.addEventListener('pointercancel',edUp);
$('#bSave').onclick=async()=>{
  if(!E.img)return;
  const c=document.createElement('canvas');c.width=OUT;c.height=OUT;const x=c.getContext('2d');
  x.beginPath();shapePath(x,E.shape,OUT,0,0);x.clip();drawPhoto(x,OUT);
  let img=c.toDataURL('image/webp',0.85);if(!/^data:image\/webp/.test(img))img=c.toDataURL('image/png');
  const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const parts=SHAPES[E.shape].parts.map(p=>p.map(([u,v])=>[Math.round(u*OUT*10)/10,Math.round(v*OUT*10)/10]));
  const ch={id,name:$('#cname').value.trim().slice(0,16),w:OUT,h:OUT,parts,img,mine:true};
  if(!await registerChar(ch,false)){$('#createMsg').textContent='保存できへんかった';return;}
  await Store.put(ch);
  $('#createMsg').textContent='追加したで！';$('#cname').value='';
  if(Srv.on())Srv.put('chars/'+id,Object.assign(sendable(ch),{by:me.id})).then(()=>{$('#createMsg').textContent='追加したで！みんなにも共有された';}).catch(()=>{$('#createMsg').textContent='追加したで！（共有は次回つながった時）';});
  renderMyList();
};
function renderMyList(){
  const list=[...CH.values()].filter(c=>!c.builtin&&!blocked.has(c.id)).reverse();
  $('#myCount').textContent='追加したキャラ（もらった分も含む）：'+list.length+'体';
  const g=$('#myList');g.innerHTML='';
  for(const c of list){
    const d=document.createElement('div');d.className='cell';
    const im=document.createElement('img');im.src=c.img;im.alt='';d.appendChild(im);
    const nm=document.createElement('div');nm.className='nm';nm.textContent=c.name||(c.mine?'自作':'もらった');d.appendChild(nm);
    const del=document.createElement('button');del.type='button';del.textContent='✕';del.setAttribute('aria-label','消す');
    del.onclick=async()=>{if(!del.classList.contains('sure')){del.classList.add('sure');del.textContent='消す';setTimeout(()=>{del.classList.remove('sure');del.textContent='✕';},2500);return;}
      blocked.add(c.id);lsSet('mrs-blocked',[...blocked]);CH.delete(c.id);await Store.del(c.id);
      if(c.mine&&Srv.on())Srv.del('chars/'+c.id).catch(()=>{});
      renderMyList();};
    d.appendChild(del);g.appendChild(d);
  }
}
$('#bCreate').onclick=()=>{show('sCreate');buildShapeButtons();drawEditor();renderMyList();$('#createMsg').textContent='';};

(async function boot(){
  for(const c of BUILTIN)await registerChar(c,true);
  const heads=[...CH.values()].filter(c=>c.builtin&&c.raw.scale);
  if(heads.length)TARGET_AREA=heads.reduce((s,c)=>s+c.parts.reduce((a,p)=>a+polyArea(p),0)*c.scale*c.scale,0)/heads.length;
  for(const c of BUILTIN)if(!c.scale){CH.delete(c.id);await registerChar(c,true);} // re-register shape chars with final target area
  await Store.open();
  for(const c of await Store.all())if(!blocked.has(c.id)&&validChar(c))await registerChar(c,false);
  requestAnimationFrame(loop);
  toTitle();
  if(Srv.on()){srvSyncChars();srvSyncPlayers();if(me.name)pushMyRec();}
})();
