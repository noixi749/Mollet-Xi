<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Mollet Xi：CATロガーの計測・SHIRATAKI（自作CDI）の点火マップの書き換え・セッティング。Mollet Xi シリーズのメインツール">
<title>Mollet Xi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Mollet Xi：暗い配色（レース用）。スマホは下にタブ、PCは左にタブ */
:root{
  --bg:#0b0f10; --panel:#131a1c; --panel2:#1a2326; --panel3:#212c30; --line:#27363b; --ink:#e9f0f1; --ink2:#a3b3b7; --mute:#6f8287;
  --acc:#f0a040; --acc-ink:#1c1204; --acc-soft:#3a2a14;
  --good:#62d26f; --warn:#f5c542; --bad:#ff5a4f; --info:#58c6d4; --live:#b58cff; --test:#58c6d4;
  --good-soft:#15301a; --warn-soft:#352c10; --bad-soft:#3a1715; --info-soft:#12303a; --live-soft:#2a2040;
  --map-ref:rgba(255,255,255,.14); --grid:#1f2b2f; --hdr:rgba(11,15,16,.94); --nav:#0e1416; --shadow:0 6px 20px rgba(0,0,0,.5);
  --rbg:#000; --rpanel:#111; --rink:#fff; --rsub:#9aa7aa; --warn-ink:#1d1600; --bad-ink:#fff; --info-ink:#03171b; --good-ink:#06200b;
  --f-ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --f-num:"Barlow Condensed","Roboto Condensed","Arial Narrow","sans-serif-condensed",system-ui,sans-serif;
  --r:12px; --tabh:60px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.hint{color:var(--ink2);font-size:13.5px;margin:4px 0}
.mute{color:var(--mute)}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}.info{color:var(--info)}.livec{color:var(--live)}

/* ---- 枠組み ---- */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;background:var(--hdr);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);min-height:50px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap;flex:none}
.brand b{font-family:var(--f-num);font-size:23px;letter-spacing:.02em;font-weight:700}
.brand b i{font-style:normal;color:var(--acc)}
.brand span{font-size:13px;color:var(--ink2);font-weight:700}
.brand b.jp{font-family:var(--f-ui);font-size:20px;letter-spacing:.01em}
html.v-molletxi .only-ganko{display:none!important}
html.v-ganko .only-mx{display:none!important}
@media (max-width:959px){html.v-molletxi nav.tabs{grid-template-columns:repeat(4,1fr)}}
@media (max-width:560px){.brand{flex-direction:column;align-items:flex-start;gap:1px;line-height:1.05}.brand b{font-size:21px}.brand span{font-size:11.5px;letter-spacing:.02em}}
.chips{display:flex;gap:6px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--mute);flex:none}
.chip.on i{background:var(--good);box-shadow:0 0 6px var(--good)}
.chip.half i{background:var(--warn)}
.chip.bad i{background:var(--bad)}
.chip.sample{border-color:var(--acc);color:var(--acc)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 7px;min-height:var(--tabh);display:grid;justify-items:center;gap:2px;color:var(--ink2);font-size:12px;position:relative}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--acc)}
nav.tabs button .dot{position:absolute;top:7px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--bad);display:none}
nav.tabs button.alert .dot{display:block}
main{padding:12px 12px calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));max-width:1180px;margin:0 auto}
main.wide{max-width:none}
@media (min-width:960px){
  nav.tabs{top:0;right:auto;bottom:0;width:92px;grid-template-columns:1fr;grid-auto-rows:min-content;padding-top:64px;border-top:0;border-right:1px solid var(--line)}
  header.top{padding-left:104px}
  main{padding:16px 20px 40px 112px}
}
.tab[hidden]{display:none}
h2.tt{font-size:18px;margin:4px 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:15.5px;margin:0 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:0 0 12px;min-width:0}
.card.flat{background:transparent}
.card>h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .sp{margin-left:auto}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.stack{display:grid;gap:8px}

/* ---- ボタン・入力 ---- */
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;min-height:42px;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--bad-ink);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn.big{min-height:56px;font-size:17px;padding:10px 20px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wfull{width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:42px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);font-weight:700}
.seg.live button[aria-pressed="true"][data-v="live"]{background:var(--live);color:var(--bg)}
.seg.live button[aria-pressed="true"][data-v="test"]{background:var(--test);color:var(--bg)}
label.fld{display:grid;gap:3px;font-size:13px;color:var(--ink2);min-width:0}
label.fld>span{white-space:nowrap}
input[type=number],input[type=text],input[type=password],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;color:var(--ink);font-size:15px}
input[type=number]{font-family:var(--f-num);font-size:17px}
.flds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sw{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.sw input{appearance:none;width:44px;height:26px;border-radius:13px;background:var(--panel3);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--ink2);transition:left .2s}
.sw input:checked{background:var(--acc)}.sw input:checked::after{left:20px;background:var(--acc-ink)}
.sw span{flex:1}

/* ---- 数字のタイル ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;position:relative}
.tile span{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b{display:block;font-family:var(--f-num);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile b small{font-size:13px;color:var(--ink2);margin-left:3px;font-weight:400}
.tile.warn{border-color:var(--warn);background:var(--warn-soft)}.tile.bad{border-color:var(--bad);background:var(--bad-soft)}.tile.good b{color:var(--good)}
.tile.nodata b{color:var(--mute)}
.tile.txt b{font-family:var(--f-ui);font-size:19px;line-height:1.5;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:11.5px;color:var(--ink2)}

/* ---- 表 ---- */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{background:var(--panel2);color:var(--ink2);font-weight:700;font-size:12.5px;position:sticky;top:0}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--acc-soft)}
tr.best td:first-child{box-shadow:inset 3px 0 0 var(--good)}
tr[data-lap]{cursor:pointer}
td.up{color:var(--good)}td.dn{color:var(--bad)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.live{border-color:var(--live);color:var(--live)}.pill.test{border-color:var(--test);color:var(--test)}.pill.fb{border-color:var(--warn);color:var(--warn)}.pill.safe{border-color:var(--bad);color:var(--bad)}.pill.fix{border-color:var(--acc);color:var(--acc)}

/* ---- シート・トースト ---- */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet{align-items:center}.sheet-card{border-radius:16px;max-height:84vh}}
.sheet-card>header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-card>header h3{margin:0;flex:1}
.sheet-body{overflow:auto;padding:14px;display:grid;gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:14px;max-width:92vw;text-align:center;box-shadow:var(--shadow)}

/* ---- 地図 ---- */
.tmap{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--panel2);border-radius:10px}
.tmap.nomap{background:var(--panel);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px}
.tm-rot{position:absolute;left:0;top:0;transition:transform .6s ease-out}
.tm-tiles{position:absolute;inset:0}.tm-tiles img{position:absolute;left:0;top:0;width:256px;height:256px;pointer-events:none;max-width:none}
.tm-tiles.pale{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.light .tm-tiles.pale{filter:none}
.tm-over{position:absolute;left:0;top:0;pointer-events:none}
.tm-ctl{position:absolute;right:8px;top:8px;display:grid;gap:6px;z-index:2}
.tm-ctl button{min-width:38px;min-height:38px;padding:0 4px;font-size:18px;font-weight:700;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.tm-ctl .tm-sty{font-size:12px}
.tm-hu svg{width:22px;height:22px;display:block;margin:auto;transition:transform .6s ease-out}.tm-hu[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.tm-attr{position:absolute;right:4px;bottom:3px;font-size:10px;color:#ddd;background:rgba(0,0,0,.55);padding:0 5px;border-radius:3px;text-decoration:none;z-index:2}
.tmap.nomap .tm-attr{display:none}

/* ---- グラフ ---- */
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--f-ui);font-size:11px;fill:var(--ink2)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .gr{stroke:var(--grid);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin-top:4px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ---- メーター（ふつう） ---- */
.meter{display:grid;gap:10px}
.m-main{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 14px 8px;text-align:center}
.m-main .lab{font-size:13px;color:var(--ink2)}
.m-main .val{font-family:var(--f-num);font-size:min(30vw,150px);line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.m-main .val small{font-size:.2em;color:var(--ink2);margin-left:6px}
.m-sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m-sub.c2{grid-template-columns:repeat(2,1fr)}
.m-sub .tile b{font-size:30px}
.mstate{font-size:13px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mstate .pill{font-size:12px}

/* ---- 全画面メーター（前のアプリのデザイン） ---- */
.full{position:fixed;inset:0;z-index:50;background:var(--rbg);color:var(--rink);display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.full .fbar{display:flex;gap:8px;padding:8px;align-items:center}
.full .fbar .btn{min-height:38px}
.full .fbody{position:relative;min-height:0}
.bm-skin{position:absolute;inset:0}
.bm-skin svg{position:absolute;inset:0;width:100%;height:100%}
.bm-skin .nd{transition:transform .35s cubic-bezier(.25,.8,.35,1)}.bm-skin .bank{transition:transform .3s}
.bm-simple{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;padding:8px 12px 12px;gap:10px}
.bm-simple .val{font-family:var(--f-num);font-size:min(40vh,34vw);line-height:.9;text-align:center;align-self:center;font-weight:600}
.bm-simple .val small{font-size:.16em;color:var(--ink2)}
.full.fs .fbar{display:none}
.full .fsx{display:none}
.full.fs .fsx{display:block;position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:3;width:48px;height:48px;border-radius:12px;border:0;background:var(--rpanel);color:var(--rsub);font-size:20px;opacity:.7}

/* ---- レースメーター（走者） ---- */
.race{position:fixed;inset:0;z-index:55;background:var(--rbg);color:var(--rink);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
.race .rtop{grid-column:1/3;display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
.race .rlap{font-family:var(--f-num);font-size:min(9vh,44px);font-weight:700;line-height:1}
.race .rlap small{font-size:.5em;color:var(--rsub);margin-left:2px}
.race .rclock{font-family:var(--f-num);font-size:min(9vh,44px);font-weight:600;text-align:center;line-height:1}
.race .rbox{font-family:var(--f-num);font-size:min(7vh,32px);font-weight:700;padding:2px 12px;border-radius:10px;background:var(--rpanel);color:var(--rink);white-space:nowrap}
.race .rbox.on{background:var(--acc);color:var(--acc-ink)}
.race .rspd{display:grid;place-items:center;min-height:0;position:relative}
.race .rspd .v{font-family:var(--f-num);font-size:min(46vh,26vw);font-weight:700;line-height:.85;font-variant-numeric:tabular-nums}
.race .rspd .u{position:absolute;right:4%;bottom:6%;font-size:14px;color:var(--rsub)}
.race .rright{display:grid;grid-template-rows:1fr 1fr;gap:6px;min-height:0}
.race .rlapt{background:var(--rpanel);border-radius:12px;padding:4px 12px;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
.race .rlapt .lb{font-size:12px;color:var(--rsub);display:block}
.race .rlapt b{font-family:var(--f-num);font-size:min(11vh,52px);line-height:1;display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.race .rlapt em{font-style:normal;font-size:12.5px;color:var(--rsub)}
.race .rlapt i{font-style:normal;font-family:var(--f-num);font-size:min(8vh,36px)}
.race .rbot{grid-column:1/3;display:grid;grid-template-columns:repeat(var(--rc,6),1fr);gap:6px}
.race .rbot .tile{background:var(--rpanel);border-color:var(--rpanel)}
.race .rbot .tile b{font-size:min(7vh,34px)}
.race .rbot .tile span{color:var(--rsub)}
.race .rexit{opacity:.8;min-height:48px;min-width:48px;padding:0;font-size:20px;background:var(--rpanel);border-color:var(--rpanel);color:var(--rsub);touch-action:none}
.race>*{min-width:0}
@media (orientation:portrait){.race{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto auto}.race .rtop,.race .rbot{grid-column:1}.race .rbot{grid-template-columns:repeat(3,1fr)}.race .rspd .v{font-size:min(46vw,40vh)}.race .rlap,.race .rclock{font-size:9vw}.race .rbox{font-size:5.6vw;padding:2px 8px}.race .rtop{gap:6px}}
.dpos{color:var(--bad)}.dneg{color:var(--good)}

/* ---- アラート ---- */
#alertLayer{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));z-index:70;display:grid;gap:6px;padding:0 10px;pointer-events:none}
@media (min-width:960px){#alertLayer{left:auto;width:560px;right:12px}}
body.racing #alertLayer{top:auto;bottom:calc(min(16vh,90px) + env(safe-area-inset-bottom,0px));left:0;right:0;width:auto}
.abar{pointer-events:auto;display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px 14px;font-weight:700;font-size:16px;box-shadow:var(--shadow);max-width:900px;margin:0 auto;width:100%}
.abar.warn{background:var(--warn);color:var(--warn-ink)}
.abar.danger{background:var(--bad);color:var(--bad-ink);animation:flash 0.8s steps(2) infinite}
.abar.info{background:var(--info);color:var(--info-ink)}
.abar .x{margin-left:auto;background:rgba(0,0,0,.25);border:0;border-radius:8px;min-height:40px;padding:0 12px;color:inherit;font-weight:700;flex:none}
.abar .x+.x{margin-left:0}
.abar span{min-width:0}
@keyframes flash{50%{background:#7a0f0a}}
.bigalert{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(160,10,5,.92);color:#fff;text-align:center;padding:20px;animation:flash2 .6s steps(2) infinite}
.bigalert b{font-family:var(--f-num);font-size:min(24vw,30vh);line-height:.9;display:block}
.bigalert span{font-size:min(6vw,5vh);font-weight:700;display:block}
.bigalert .bx{margin-top:18px;min-height:52px;padding:0 28px;border-radius:14px;border:2px solid #fff;background:rgba(0,0,0,.25);color:#fff;font-size:20px;font-weight:700}
@keyframes flash2{50%{background:rgba(40,0,0,.95)}}
@media (prefers-reduced-motion:reduce){.abar.danger,.bigalert{animation:none}}

/* ---- CDIマップ編集 ---- */
.mapedit{position:relative;touch-action:none;user-select:none}
.mapedit svg{display:block;width:100%;height:auto}
.mapedit .pt{fill:var(--acc);stroke:var(--bg);stroke-width:2;cursor:grab}
.mapedit text{font-family:var(--f-ui)}
.mapedit .pt.sel{fill:var(--ink)}
.mapin{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.mapin label{display:grid;font-size:11px;color:var(--ink2);text-align:center}
.mapin input{min-height:34px;padding:2px 4px;text-align:center;font-size:15px}
@media (max-width:520px){.mapin{grid-template-columns:repeat(4,1fr)}}
.plist{display:grid;gap:6px}
.pitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--panel2);min-width:0}
.pitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem.act{border-color:var(--acc)}
.pitem.bk{align-items:flex-start;flex-wrap:wrap}
.pitem.bk .nm{white-space:normal;flex:1 1 200px}
.pitem.bk .nm small{display:block;color:var(--ink2);font-size:12px;line-height:1.5;margin-top:2px}
.pitem.bk>.btn,.pitem.bk>.pill{flex:none;align-self:center}
.bknow{display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-bottom:8px}
.bknow .bkname{font-size:17px}
.bknow p.hint{margin:0}
a.btn{text-decoration:none;color:var(--ink)}
html.apk [data-usb]{display:none!important}
.spark{height:26px;width:90px;flex:none}

/* ---- ピット ---- */
.pithead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.pithead .big{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1}
.pithead .grp{display:grid;gap:0}
.pithead .grp span{font-size:11.5px;color:var(--ink2)}
.pitgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:1100px){.pitgrid{grid-template-columns:1.2fr 1fr 1fr}.pitgrid .span2{grid-column:span 2}.pitgrid .span3{grid-column:1/-1}}
@media (min-width:700px) and (max-width:1099px){.pitgrid{grid-template-columns:1fr 1fr}.pitgrid .span2,.pitgrid .span3{grid-column:1/-1}}
.why{font-size:12.5px;color:var(--live);display:flex;gap:6px;flex-wrap:wrap}
.why span{border:1px solid var(--live-soft);background:var(--live-soft);border-radius:6px;padding:0 6px}
.alist{display:grid;gap:6px}
.aitem{display:flex;gap:8px;align-items:center;border-radius:8px;padding:6px 10px;font-size:14px;background:var(--panel2);border-left:4px solid var(--info)}
.aitem.warn{border-left-color:var(--warn)}.aitem.danger{border-left-color:var(--bad);background:var(--bad-soft)}
.aitem time{margin-left:auto;color:var(--ink2);font-size:12px}

/* ---- 色の選択 ---- */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.thm{position:relative;display:grid;gap:3px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2);color:var(--ink);min-width:0}
.thm.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.thm[disabled]{cursor:default;opacity:1}
.thm .sw4{display:flex;height:22px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}.thm .sw4 i{flex:1}
.thm b{font-size:14px}.thm small{color:var(--ink2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thm-x{position:absolute;right:6px;bottom:6px;font-size:12px;color:var(--ink2);padding:2px 6px;border-radius:6px}
.thm-x:hover{background:var(--panel3)}
input[type=color]{width:100%;height:42px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer}
details summary{cursor:pointer}
/* ---- はじめて ---- */
.hero{background:linear-gradient(135deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.hero h2{margin:0 0 6px;font-size:20px}
.steps{display:grid;gap:6px;margin:10px 0 0;padding-left:20px}
.samplebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;border:1px dashed var(--acc);border-radius:12px;padding:8px 10px;margin-bottom:12px;background:var(--acc-soft)}
.samplebar{display:block;padding:6px 10px}
.samplebar summary{cursor:pointer;color:var(--acc);font-weight:700;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px}
.samplebar summary::-webkit-details-marker{display:none}
.samplebar summary::after{content:"▾ 試す";margin-left:auto;font-weight:400;color:var(--ink2)}
.samplebar[open] summary::after{content:"▴ たたむ"}
.samplebar .row{margin-top:8px}

<script>
const APP_ID = "molletxi";
/* ===MXS=== Mollet Xi シリーズのデータ共有
   アプリ版：window.MXShare（同じ鍵で署名したアプリどうしでファイルを見せ合う）
   ブラウザ版：同じサイト（noixi749.github.io）の localStorage に「mxs.アプリ.名前」で置く
   アプリの呼び名：molletxi（Mollet Xi）・ganko（耐久がんこちゃん）・nusumu（データ盗む君）・sd（SD測る君） */
const MXS = (() => {
  const NAMES = { molletxi: "Mollet Xi", ganko: "耐久がんこちゃん", nusumu: "データ盗む君", sd: "SD測る君" };
  let me = "";
  const N = () => (typeof window !== "undefined" && window.MXShare) ? window.MXShare : null;
  const wrap = d => JSON.stringify({ app: me, t: Date.now(), d });
  return {
    NAMES,
    init(id) { me = id; },
    get me() { return me; },
    native() { return !!N(); },
    put(name, d) { const s = wrap(d); try { if (N()) return N().put(name, s) === "ok"; localStorage.setItem(`mxs.${me}.${name}`, s); return true; } catch (e) { return false; } },
    putRaw(name, text) { try { if (N()) return N().put(name, text) === "ok"; localStorage.setItem(`mxs.${me}.${name}`, text); return true; } catch (e) { return false; } },
    append(name, text) { try { if (N()) return N().append(name, text) === "ok"; const k = `mxs.${me}.${name}`; localStorage.setItem(k, (localStorage.getItem(k) || "") + text); return true; } catch (e) { return false; } },
    del(name) { try { if (N()) N().del(name); else localStorage.removeItem(`mxs.${me}.${name}`); } catch (e) { } },
    raw(app, name) { try { return (N() ? N().get(app, name) : localStorage.getItem(`mxs.${app}.${name}`)) || ""; } catch (e) { return ""; } },
    get(app, name) { const s = this.raw(app, name); if (!s) return null; try { return JSON.parse(s); } catch (e) { return null; } },
    range(app, name, start, max) {
      try { if (N()) return JSON.parse(N().range(app, name, start, max)); const s = localStorage.getItem(`mxs.${app}.${name}`) || ""; return { t: s.slice(start), next: s.length, eof: true }; }
      catch (e) { return { t: "", next: start, eof: true, err: 1 }; } },
    list(app) {
      try { if (N()) return JSON.parse(N().list(app) || "[]");
        const p = `mxs.${app}.`, out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(p)) { const v = localStorage.getItem(k) || ""; let t = 0; try { t = JSON.parse(v).t || 0; } catch (e) { } out.push({ n: k.slice(p.length), t, s: v.length }); } } return out;
      } catch (e) { return []; } },
    has(app) { try { if (N()) return !!JSON.parse(N().apps())[app]; return this.list(app).length > 0; } catch (e) { return false; } },
  };
})();
/* ===/MXS=== */

/* ============================================================
   Mollet Xi（CATロガー・SHIRATAKI）   製作者 Naohisa Akiyama
   走行メーター・CDI管理・ロガー・レース（走者／ピット）
   ============================================================ */
"use strict";
const APP_VER = "1.2.0";
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const isNum = x => typeof x === "number" && isFinite(x);
const num = (x, a, b) => isNum(x) && (a == null || x >= a) && (b == null || x <= b) ? x : null;
const f = (x, d) => isNum(x) ? (+x).toFixed(d) : "–";
const pad2 = n => String(n).padStart(2, "0");
const sgn = (x, d) => !isNum(x) ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "±") + Math.abs(x).toFixed(d);
const CLOCK = { fake: null, ff: false };           // サンプル記録を早送りで作るときだけ時計を差し替える
const now = () => CLOCK.fake != null ? CLOCK.fake : Date.now();
const D2R = Math.PI / 180;
function hav(a1, o1, a2, o2) { const R = 6371000, dA = (a2 - a1) * D2R, dO = (o2 - o1) * D2R, s = Math.sin(dA / 2) ** 2 + Math.cos(a1 * D2R) * Math.cos(a2 * D2R) * Math.sin(dO / 2) ** 2; return 2 * R * Math.asin(Math.min(1, Math.sqrt(s))); }
function bearing(a1, o1, a2, o2) { const y = Math.sin((o2 - o1) * D2R) * Math.cos(a2 * D2R), x = Math.cos(a1 * D2R) * Math.sin(a2 * D2R) - Math.sin(a1 * D2R) * Math.cos(a2 * D2R) * Math.cos((o2 - o1) * D2R); return (Math.atan2(y, x) / D2R + 360) % 360; }
/* 局所平面（メートル）。基準点のまわりだけ正確 */
function enu(lat0, lon0) { const kx = 111320 * Math.cos(lat0 * D2R), ky = 110540; return { x: (la, lo) => [(lo - lon0) * kx, (la - lat0) * ky], ll: (x, y) => [lat0 + y / ky, lon0 + x / kx] }; }
function fmtLap(ms) { if (!isNum(ms)) return "–:––.––"; const s = ms / 1000, m = Math.floor(s / 60); return `${m}:${(s - m * 60).toFixed(2).padStart(5, "0")}`; }
function fmtDur(sec) { if (!isNum(sec)) return "–"; sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60; return h ? `${h}:${pad2(m)}:${pad2(s)}` : `${m}:${pad2(s)}`; }
function fmtDate(t) { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const median = a => { if (!a.length) return null; const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

/* ---- 保存（この端末）
   Mollet Xi と 耐久がんこちゃん で共有するもの（プリセット・バイク・設定・コースなど）は「mx-」。
   画面の状態など、そのアプリだけのものは Mollet Xi「mx-」・耐久がんこちゃん「gk-」。
   ブラウザ版は同じサイトなので、そのまま共有される。アプリ版は SYNC で見せ合う。 ---- */
document.documentElement.classList.add("v-" + APP_ID);
MXS.init(APP_ID);
const SHARED_LS = new Set(["presets", "set", "bikes", "bikeAuto", "bikeInit", "cdiCfg", "cdiWant", "courses", "courseCur", "learnL", "lay", "layUser", "mMap", "mapHU", "theme", "themeUser", "raceSubs", "myid"]);
const LS_PFX = APP_ID === "ganko" ? "gk-" : "mx-";
const lsKey = k => SHARED_LS.has(k) ? "mx-" + k : LS_PFX + k;
const LS = {
  get(k, d) { try { const v = localStorage.getItem(lsKey(k)); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(lsKey(k), JSON.stringify(v)); if (SHARED_LS.has(k)) SYNC.touch(k); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(lsKey(k)); if (SHARED_LS.has(k)) SYNC.touch(k); } catch (e) { } }
};
/* アプリ版どうし（Mollet Xi ⇔ 耐久がんこちゃん）で、共有する設定を新しい方にそろえる */
const SYNC = {
  sib: APP_ID === "ganko" ? "molletxi" : "ganko", meta: {}, pt: 0,
  loadMeta() { try { this.meta = JSON.parse(localStorage.getItem("mx-_mt") || "{}") || {}; } catch (e) { this.meta = {}; } },
  saveMeta() { try { localStorage.setItem("mx-_mt", JSON.stringify(this.meta)); } catch (e) { } },
  touch(k) { if (!MXS.native()) return; this.meta[k] = Date.now(); this.saveMeta(); clearTimeout(this.pt); this.pt = setTimeout(() => this.publish(), 800); },
  publish() { if (!MXS.native()) return; const keys = {}; for (const k of SHARED_LS) { let v = null; try { v = localStorage.getItem("mx-" + k); } catch (e) { } if (v != null) keys[k] = { t: this.meta[k] || 0, v }; else if (this.meta[k]) keys[k] = { t: this.meta[k], v: null }; } MXS.put("ls", { keys }); },
  pull() {
    if (!MXS.native()) return 0; const b = MXS.get(this.sib, "ls"); if (!b || !b.d || !b.d.keys) return 0; let n = 0;
    for (const [k, e] of Object.entries(b.d.keys)) {
      if (!SHARED_LS.has(k) || !e) continue; const lt = this.meta[k] || 0; let cur = null; try { cur = localStorage.getItem("mx-" + k); } catch (_) { }
      if ((e.t || 0) > lt || (lt === 0 && cur == null && e.v != null)) {
        if (e.v === cur) { this.meta[k] = e.t || 0; continue; }
        try { if (e.v == null) localStorage.removeItem("mx-" + k); else localStorage.setItem("mx-" + k, e.v); } catch (_) { }
        this.meta[k] = e.t || 0; n++;
      }
    }
    if (n) this.saveMeta(); return n;
  },
};
SYNC.loadMeta();
if (MXS.native()) { SYNC.pull(); setTimeout(() => SYNC.publish(), 1500); }

/* ---- 小さなイベントの仕組み ---- */
const BUS = { h: {}, on(e, f) { (this.h[e] = this.h[e] || []).push(f); }, emit(e, d) { (this.h[e] || []).forEach(f => { try { f(d); } catch (err) { console.error(e, err); } }); } };

/* ---- アプリ版（APK）：Bluetooth・保存・画面の点灯などはアプリ側（MXNative）がする ---- */
const IS_APK = !!(window.MXNative);
if (IS_APK) document.documentElement.classList.add("apk");
window.__mxNative = o => { try { BUS.emit("native", typeof o === "string" ? JSON.parse(o) : o); } catch (e) { console.error(e); } };

/* ---- 設定 ---- */
const AGGR = {
  attack: { name: "攻め", warn: 245, crit: 270, k: 0.12, maxRet: 3, learnMax: 2.0 },
  normal: { name: "標準", warn: 230, crit: 255, k: 0.16, maxRet: 4.5, learnMax: 1.5 },
  safe:   { name: "守り", warn: 215, crit: 240, k: 0.22, maxRet: 6, learnMax: 1.0 },
};
const SET_DEF = () => ({
  name: "", role: "rider",
  // 外周はSD測る君と同じ「外径 × π × 0.96」（3.00-10 = 413mm）。name・mid は使っているマイバイク
  bike: { mass: 130, circ: 1246, sec: 12.874, lo: 2.515, top: 0.781, peak: 8000, cda: 0.6, crr: 0.015, limit: 9200, name: "", mid: "" },
  lg: { wp: 1, rp: 1, vs: 0, up: null },
  fuel: { full: null, empty: null, cap: 0, k: 0.22, filt: 20 },
  alert: { autoPit: true, fuelLaps: 2, vbLow: 10.4, slipPct: 8, riseC: 25, vibrate: true, sound: true },
  heat: { aggr: "attack", warn: 245, crit: 270, learn: false, manual: 0, cold: 120 },
  cdi: { fbOnAny: false, ttl: 800, autoResume: true },
  team: { group: "", pass: "", accept: true, brokers: null },
  race: { laps: 60, mins: 0 },
  view: { map: "pale", keep: true, units: "kmh" },
  test: { a: null, b: null, by: "lap", sec: 30 },
  sample: false,
});
function deepMerge(d, o) { if (!o || typeof o !== "object") return d; for (const k of Object.keys(d)) { if (d[k] && typeof d[k] === "object" && !Array.isArray(d[k])) d[k] = deepMerge(d[k], o[k]); else if (o[k] !== undefined) d[k] = o[k]; } return d; }
let SET = deepMerge(SET_DEF(), LS.get("set", null));
const saveSet = () => LS.set("set", SET);
if (!SET.name) { SET.name = "ID" + Math.random().toString(36).slice(2, 6).toUpperCase(); }
let MYID = LS.get("myid", null); if (!MYID) { MYID = Math.random().toString(16).slice(2, 10); LS.set("myid", MYID); }

/* ---- 点火マップの回転軸（CDIと同じ） ---- */
const AX = [1000, 2000, 3000, 4000, 5000, 5500, 6000, 6500, 7000, 7500, 8000, 8500, 9000, 9500, 10000, 11000];
const NB = AX.length;
function interpMap(m, rpm) { if (!m) return null; if (rpm <= AX[0]) return m[0]; for (let i = 1; i < NB; i++) if (rpm <= AX[i]) return m[i - 1] + (m[i] - m[i - 1]) * (rpm - AX[i - 1]) / (AX[i] - AX[i - 1]); return m[NB - 1]; }
const q25 = x => Math.round(x * 4) / 4;
const cleanMap = a => Array.isArray(a) && a.length === NB && a.every(isNum) ? a.map(x => clamp(q25(x), 0, 25)) : null;

/* ---- IndexedDB（走行記録は大きいので） ---- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      let r; try { r = indexedDB.open("mollet-xi", 1); } catch (e) { rej(e); return; }

  link() { return this.links.find(l => l.open && l.type === "usb") || this.links.find(l => l.open && l.type === "ble") || this.links.find(l => l.open); }

    this.links.push(link);
    link.onLine = ln => this.rx(ln);

    if (link.open) link.onState(true);

  }

  send(o) { const l = this.link(); if (!l) return false; l.write(JSON.stringify(o) + "\n"); return true; }

  cmd(o, ms) { return new Promise(res => { const id = this.seq++; o.id = id; let t = 0; this.pend.set(id, r => { clearTimeout(t); res(r); });   // 返事が同期で来ても取りこぼさないよう先に登録

  } catch (e) { }

  try { if (!HAS_SERIAL && HAS_WEBUSB) { for (const d of await navigator.usb.getDevices()) { const l = new UsbCdcLink(d); l.connect().then(() => routeLink(l)).catch(() => { }); } } } catch (e) { }
}
if (HAS_SERIAL) navigator.serial.addEventListener("connect", e => { if (SET.sample) return; const l = new SerialLink(e.target || e.port); l.connect().then(() => routeLink(l)).catch(() => { }); });
if (HAS_WEBUSB && !HAS_SERIAL) navigator.usb.addEventListener("connect", e => { if (SET.sample) return; const l = new UsbCdcLink(e.device); l.connect().then(() => routeLink(l)).catch(() => { }); });

/* ============================================================
   いまの値（LV）：ロガー・CDI・スマホのGPS から作る
   走者側はここから記録・ラップ・アラート・ピット送信
   ピット側はチームから届いた値で同じ LV を埋める
   ============================================================ */
const LV = {
  t: 0, lat: null, lon: null, v: null, gs: null, hdg: null, alt: null, acc: null, sat: null, gsrc: null, gAt: 0,
  rpm: null, wrpm: null, wv: null, cht: null, chtRate: null, at: null, ah: null, ap: null, rho: null,
  fuRaw: null, fuel: null, fuelL: null, vsLog: null, yr: null, lean: null, glat: null, glong: null,
  cdi: null, cdiAt: 0, lgAt: 0, remote: false,
};
const G0 = 9.80665;
function airDens(tc, rh, hpa) { if (!isNum(tc) || !isNum(hpa)) return null; const es = 6.1078 * Math.pow(10, 7.5 * tc / (tc + 237.3)), pv = (isNum(rh) ? rh : 50) / 100 * es * 100, T = tc + 273.15; return (hpa * 100 - pv) / (287.05 * T) + pv / (461.5 * T); }
const wheelKmh = wrpm => isNum(wrpm) ? wrpm * SET.bike.circ / 1e6 * 60 : null;

/* 速度の履歴（前後G・パワー推定用） */
const VH = { a: [], push(t, v) { this.a.push([t, v]); while (this.a.length && t - this.a[0][0] > 1200) this.a.shift(); },
  slope() { const a = this.a; if (a.length < 3 || a[a.length - 1][0] - a[0][0] < 300) return null; let n = a.length, st = 0, sv = 0, stt = 0, stv = 0; const t0 = a[0][0];
    for (const [t, v] of a) { const x = (t - t0) / 1000; st += x; sv += v; stt += x * x; stv += x * v; } const d = n * stt - st * st; return d ? (n * stv - st * sv) / d : null; } };   // (km/h)/s
const TH = { a: [], push(t, c) { if (!isNum(c)) return; const L = this.a[this.a.length - 1]; if (L && t - L[0] < 1000) return; this.a.push([t, c]); while (this.a.length && t - this.a[0][0] > 40000) this.a.shift(); },
  rate() { const a = this.a; if (a.length < 8) return null; let n = a.length, st = 0, sv = 0, stt = 0, stv = 0; const t0 = a[0][0]; for (const [t, v] of a) { const x = (t - t0) / 60000; st += x; sv += v; stt += x * x; stv += x * v; } const d = n * stt - st * st; return d ? (n * stv - st * sv) / d : null; } };   // ℃/分
const HDGH = { last: null };

/* ---- ロガーから ---- */
LOG_DEV.onMsg(o => {
  if (o.t !== "lg") return;
  const t = now(); LV.lgAt = t; LV.remote = false;
  if (isNum(o.rpm)) LV.rpmLg = o.rpm;
  if (isNum(o.wrpm)) { LV.wrpm = o.wrpm; LV.wv = wheelKmh(o.wrpm); }
  LV.cht = isNum(o.et) ? o.et : null; TH.push(t, LV.cht); LV.chtRate = TH.rate();
  if (isNum(o.temp)) LV.at = o.temp; if (isNum(o.hum)) LV.ah = o.hum; if (isNum(o.press)) LV.ap = o.press;
  LV.rho = airDens(LV.at, LV.ah, LV.ap);
  if (isNum(o.fu)) FUEL.raw(o.fu, t);
  if (isNum(o.vs)) LV.vsLog = o.vs;
  if (isNum(o.yr)) LV.yr = o.yr;
  if (Array.isArray(o.imu)) LV.imu = o.imu;
  if (isNum(o.lat) && isNum(o.lon) && Math.abs(o.lat) <= 90 && (o.lat || o.lon)) gpsFix({ t, lat: o.lat, lon: o.lon, v: isNum(o.gs) ? o.gs : null, hdg: num(o.hdg, 0, 360), alt: num(o.alt), acc: isNum(o.acc) ? o.acc : 3, sat: o.sat, src: "lg" });
  else if (isNum(o.sat)) LV.sat = o.sat;
  derive(t);
});
/* ---- CDIから ---- */
CDI_DEV.onMsg(o => {
  if (o.t === "st") { LV.cdi = o; LV.cdiAt = now(); if (isNum(o.rpm)) LV.rpmCdi = o.rpm; }
  else if (o.t === "cfg") { CDI.cfg = o; BUS.emit("cdiCfg", o); }
  else if (o.t === "ev" && o.e === "fallback") BUS.emit("cdiFallback", o);
});

/* ---- スマホのGPS（ロガーのGPSが来ていない時だけ使う） ---- */
const GPS = {
  id: null, users: new Set(), err: "",
  start(u) { this.users.add(u || "x"); if (this.id != null || !navigator.geolocation || SET.sample) return;
    this.id = navigator.geolocation.watchPosition(p => { if (now() - (LV.gAtLg || 0) < 3000) return; const c = p.coords; gpsFix({ t: now(), lat: c.latitude, lon: c.longitude, v: c.speed == null || c.speed < 0 ? null : c.speed * 3.6, hdg: num(c.heading, 0, 360), alt: num(c.altitude), acc: c.accuracy, src: "ph" }); this.err = ""; },
      e => { this.err = e.code === 1 ? "位置情報が許可されていません" : e.code === 2 ? "位置情報がオフです" : "GPSを探しています"; BUS.emit("gpsErr", this.err); }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 }); },
  stop(u) { this.users.delete(u || "x"); if (!this.users.size && this.id != null) { navigator.geolocation.clearWatch(this.id); this.id = null; } },
};
let lastFix = null;
function gpsFix(g) {
  if (g.src === "lg") LV.gAtLg = g.t;
  let v = g.v;
  if (lastFix && v == null) { const d = hav(lastFix.lat, lastFix.lon, g.lat, g.lon), dt = (g.t - lastFix.t) / 1000; if (dt > 0 && dt < 5) v = d / dt * 3.6; }
  let hdg = g.hdg; if (hdg == null && lastFix && hav(lastFix.lat, lastFix.lon, g.lat, g.lon) > 1.5) hdg = bearing(lastFix.lat, lastFix.lon, g.lat, g.lon);
  // 進む向きの変化（IMUが無いときのバンク角用）
  if (hdg != null && HDGH.last && v != null && v > 8) { const dt = (g.t - HDGH.last.t) / 1000; if (dt > 0.05 && dt < 2) { const dh = ((hdg - HDGH.last.h + 540) % 360) - 180; LV.hdgRate = dh / dt; } }
  if (hdg != null) HDGH.last = { t: g.t, h: hdg };
  Object.assign(LV, { lat: g.lat, lon: g.lon, gs: v, hdg: hdg != null ? hdg : LV.hdg, alt: g.alt, acc: g.acc, sat: g.sat != null ? g.sat : LV.sat, gsrc: g.src, gAt: g.t });
  lastFix = { t: g.t, lat: g.lat, lon: g.lon };
  derive(g.t);
  BUS.emit("fix", { t: g.t, lat: g.lat, lon: g.lon, v: LV.v, hdg: LV.hdg, acc: g.acc, src: g.src });
}

/* ---- 組み合わせて計算 ---- */
function derive(t) {
  LV.t = t;
  const cdiOk = LV.cdi && t - LV.cdiAt < 800 && LV.cdi.nano;
  LV.rpm = cdiOk && isNum(LV.rpmCdi) ? LV.rpmCdi : (t - LV.lgAt < 1500 && isNum(LV.rpmLg) ? LV.rpmLg : null);
  const lgOk = t - LV.lgAt < 1500;
  const wheelOk = lgOk && isNum(LV.wv) && SET.lg.wp > 0 && LV.wheelSeen;
  if (lgOk && isNum(LV.wrpm) && LV.wrpm > 0) LV.wheelSeen = true;
  const gOk = t - LV.gAt < 3000;
  LV.v = wheelOk ? LV.wv : (gOk ? LV.gs : null);
  if (isNum(LV.v)) VH.push(t, LV.v);
  const sl = VH.slope(); LV.glong = sl == null ? null : sl / 3.6 / G0;
  // バンク角：IMU（鉛直まわりの回転）があればそれ、なければGPSの向きの変化
  const vms = isNum(LV.v) ? LV.v / 3.6 : null;
  let wz = null, imu = false;
  if (lgOk && isNum(LV.yr)) { wz = LV.yr; imu = true; }             // 左回り＋（度/秒）。車体に付いたIMUは Ω·cos(バンク)
  else if (isNum(LV.hdgRate) && gOk) wz = -LV.hdgRate;               // GPSの方位は右回り＋なので反転。こちらは Ω そのもの
  if (vms != null && wz != null && vms > 3) { const k = vms * wz * D2R / G0; const lean = -(imu ? Math.asin(clamp(k, -0.97, 0.97)) : Math.atan(k)) / D2R; LV.lean = LV.lean == null ? lean : LV.lean * 0.6 + lean * 0.4; LV.glat = Math.tan(LV.lean * D2R); }
  else { LV.lean = vms != null && vms <= 3 ? 0 : null; LV.glat = LV.lean === 0 ? 0 : null; }
}

/* ============================================================
   燃料計
   ============================================================ */
const FUEL = {
  buf: [], pctF: null, lastT: 0, used: 0, startPct: null, startT: 0, lapUse: [], lapStartUsed: 0, kAuto: null,
  calOk() { const c = SET.fuel; return isNum(c.full) && isNum(c.empty) && Math.abs(c.full - c.empty) > 40; },
  raw(mv, t) {
    LV.fuRaw = mv;
    if (!this.calOk()) { LV.fuel = null; LV.fuelL = null; return; }
    const c = SET.fuel; const p = clamp((mv - c.empty) / (c.full - c.empty) * 100, 0, 100);
    // 揺れ対策：加減速・バンク中は使わない。中央値＋ゆっくり追従
    const calm = !(isNum(LV.glong) && Math.abs(LV.glong) > 0.15) && !(isNum(LV.lean) && Math.abs(LV.lean) > 12);
    if (calm) { this.buf.push(p); if (this.buf.length > 60) this.buf.shift(); }
    const m = median(this.buf); if (m == null) return;
    const dt = this.lastT ? (t - this.lastT) / 1000 : 0; this.lastT = t;
    const tau = Math.max(2, SET.fuel.filt || 20);
    if (this.pctF == null || Math.abs(m - this.pctF) > 25 && (LV.v || 0) < 3) this.pctF = m;     // 給油
    else this.pctF += (m - this.pctF) * Math.min(1, dt / tau);
    LV.fuel = this.pctF; LV.fuelL = SET.fuel.cap > 0 ? this.pctF / 100 * SET.fuel.cap : null;
    if (this.startPct == null) { this.startPct = this.pctF; this.startT = t; }
    // 給油の自動検出
    if (this.startPct != null && this.pctF - this.startPctNow() > 20 && (LV.v || 0) < 3) this.refuel("auto");
  },
  startPctNow() { return this.startPct == null ? null : this.startPct - (SET.fuel.cap > 0 ? this.used / SET.fuel.cap * 100 : 0); },
  /* 消費の見積もり（回転 × 係数）。係数は燃料計が15%以上減ったら実測に合わせる */
  tick(dt) {
    const r = LV.rpm; if (!isNum(r) || r < 1500) return;
    const k = this.kAuto || SET.fuel.k;                                  // L/h ÷ 1000rpm
    const load = isNum(LV.glong) && LV.glong < -0.08 ? 0.35 : 1;
    this.used += k * r / 1000 * load * dt / 3600;
    this.units = (this.units || 0) + r / 1000 * load * dt / 3600;
    if (this.startPct != null && this.pctF != null && SET.fuel.cap > 0) {
      const drop = (this.startPct - this.pctF) / 100 * SET.fuel.cap;
      if (drop > SET.fuel.cap * 0.15 && this.units > 0.05) { const kk = drop / this.units; if (kk > 0.05 && kk < 1.5) this.kAuto = this.kAuto ? this.kAuto * 0.7 + kk * 0.3 : kk; }
    }
  },
  refuel(why) { this.used = 0; this.units = 0; this.startPct = this.pctF; this.startT = now(); this.lapUse = []; this.lapStartUsed = 0; if (why !== "silent") BUS.emit("refuel", why); },
  onLap() { const u = this.used - this.lapStartUsed; this.lapStartUsed = this.used; if (u > 0) { this.lapUse.push(u); if (this.lapUse.length > 5) this.lapUse.shift(); } },
  perLap() { const a = this.lapUse.slice(-3); return a.length ? mean(a) : null; },
  remainL() { if (SET.fuel.cap > 0 && isNum(LV.fuel)) return LV.fuel / 100 * SET.fuel.cap; if (SET.fuel.cap > 0 && this.startPct != null) return Math.max(0, this.startPct / 100 * SET.fuel.cap - this.used); return null; },
  lapsLeft() { const r = this.remainL(), p = this.perLap(); return r != null && p ? r / p : null; },
};

/* ============================================================
   点火：プリセット・CDIの枠・モード（固定／テスト／リアルタイム反映β）
   熱補正・学習（β）・理論値の初期マップ・ログからの導出
   ============================================================ */
const THEORY_BASE = [8, 12, 15, 17, 18, 19, 19.5, 20, 20, 19, 17, 16, 15, 14, 13, 11];
const PRE_DEF = () => [
  { id: "p18", name: "18度固定（今と同じ）", a: new Array(NB).fill(18), rl: 10500, src: "base", t: 0 },
  { id: "prace", name: "レース基本（初期値）", a: THEORY_BASE.slice(), rl: 10500, src: "theory", t: 0 },
];
let PRESETS = LS.get("presets", null) || PRE_DEF();
PRESETS = PRESETS.filter(p => p && cleanMap(p.a)).map(p => ({ ...p, a: cleanMap(p.a) }));
const savePresets = () => LS.set("presets", PRESETS);
const presetById = id => PRESETS.find(p => p.id === id);

const MODE_TXT = { fix: "固定", test: "テスト", live: "リアルタイム反映β", fb: "フェイルセーフ", safe: "安全スイッチ", cal: "パルサー測定" };
const CDI = {
  cfg: LS.get("cdiCfg", null),
  want: LS.get("cdiWant", { m: "fix" }),     // この端末が望むモード
  out: { g: 0, tr: new Array(NB).fill(0) },  // いま送っている補正
  tgt: { g: 0, tr: new Array(NB).fill(0), why: [] },
  susp: null,                                 // ロガーが切れて止めている
  lastSend: 0, lastHb: 0,
  st() { return LV.cdi && now() - LV.cdiAt < 1500 ? LV.cdi : null; },
  mode() { const s = this.st(); return s ? s.m : null; },
  slots() { return this.cfg && Array.isArray(this.cfg.slots) ? this.cfg.slots : null; },
  baseMap() { const s = this.slots(), st = this.st(); const i = st ? st.s : this.cfg ? this.cfg.act : 0; return s && s[i] ? s[i].a : null; },
  saveWant() { LS.set("cdiWant", this.want); },
};
BUS.on("cdiCfg", c => { CDI.cfg = c; LS.set("cdiCfg", c); });

/* ---- 命令（返事を待つ） ---- */
async function cdiCmd(o, okMsg) {
  if (!CDI_DEV.on) { toast("CDIがつながっていません"); return { ok: 0 }; }
  const r = await CDI_DEV.cmd(o);
  if (r.ok) { if (okMsg) toast(okMsg); } else toast("CDI：" + (r.err || "失敗しました"));
  return r;
}
async function cdiWriteSlot(i, p) { return cdiCmd({ c: "slot", i, n: p.name.slice(0, 18), a: p.a, rl: p.rl || 10500 }, `枠${i + 1}に「${p.name}」を書き込みました`); }
async function cdiUse(i) { CDI.want = { m: "fix", slot: i }; CDI.saveWant(); return cdiCmd({ c: "use", i }, `枠${i + 1}で点火します`); }
async function cdiSetFb(i) { return cdiCmd({ c: "fb", i }, `通信が切れたら枠${i + 1}に切り替えます`); }
async function cdiPar(o) { return cdiCmd(Object.assign({ c: "par" }, o), "CDIの設定を保存しました"); }
function cdiSetMode(m, extra) {
  CDI.want = Object.assign({ m }, extra || {}); CDI.saveWant(); CDI.susp = null;
  if (m === "fix") { const i = CDI.want.slot != null ? CDI.want.slot : (CDI.cfg ? CDI.cfg.act : 1); cdiCmd({ c: "use", i }); }
  if (m === "test") { TEST.cur = 0; TEST.sendCur(); }
  if (m === "live") { LEARN.reset(); CDI.out = { g: 0, tr: new Array(NB).fill(0) }; }
  BUS.emit("cdiWant", CDI.want);
}

/* ============================================================
   熱補正（耐久レース用）
   ・シリンダ温度が「警告」を超えた分だけ、高回転側を中心に遅角
   ・冷えている間は中回転を少しだけ進角
   ・空気が薄い／熱いときの小さな補正
   ・ピットからの手動オフセット
   ・学習（β）：周回ごとに ±0.5° を交互に試して、加速が良い側へ 0.25° ずつ動かす
   ============================================================ */
function heatTarget() {
  const A = AGGR[SET.heat.aggr] || AGGR.attack;
  const warn = SET.heat.warn, crit = SET.heat.crit, peak = SET.bike.peak;
  const tr = new Array(NB).fill(0), why = []; let g = 0;
  const cht = LV.cht, rate = LV.chtRate;
  if (isNum(cht) && cht > warn) {
    const ex = cht - warn; let ret = A.k * ex; if (isNum(rate) && rate > SET.alert.riseC) ret += 0.5;
    if (cht >= crit) ret = Math.max(ret, A.maxRet * 0.8);
    ret = Math.min(A.maxRet, ret);
    for (let i = 0; i < NB; i++) { const w = AX[i] >= peak - 500 ? 1 : AX[i] >= peak - 2500 ? 0.5 : 0.15; tr[i] -= ret * w; }
    why.push(`温度 ${Math.round(cht)}℃ → 高回転 −${ret.toFixed(1)}°`);
  } else if (isNum(cht) && cht < SET.heat.cold) {
    for (let i = 0; i < NB; i++) if (AX[i] >= 3000 && AX[i] <= 8000) tr[i] += 0.5;
    why.push(`暖機中 ${Math.round(cht)}℃ → 中回転 +0.5°`);
  }
  if (isNum(LV.rho)) { const a = clamp((1 - LV.rho / 1.2) * 8, -0.5, 1.0); if (Math.abs(a) >= 0.1) { g += a; why.push(`空気 ${Math.round(LV.rho / 1.225 * 100)}% → ${sgn(a, 1)}°`); } }
  if (isNum(LV.at) && LV.at > 35) { const a = -Math.min(1, (LV.at - 35) / 10); g += a; why.push(`気温 ${Math.round(LV.at)}℃ → ${sgn(a, 1)}°`); }
  if (SET.heat.manual) { g += SET.heat.manual; why.push(`手動 ${sgn(SET.heat.manual, 1)}°`); }
  if (SET.heat.learn) { for (let i = 0; i < NB; i++) tr[i] += LEARN.L[i] + LEARN.sign * LEARN.d * (isNum(cht) && cht > warn - 10 ? 0 : 1); const s = LEARN.summary(); if (s) why.push(s); }
  for (let i = 0; i < NB; i++) tr[i] = clamp(tr[i], -6, 3);
  return { g: clamp(g, -3, 2), tr, why };
}
/* 出力はゆっくり動かす：遅角は1秒に1°まで、進角は1秒に0.25°まで */
function smoothOut(tg, dt) {
  const up = 0.25 * dt, dn = 1.0 * dt, o = CDI.out;
  const mv = (cur, t) => t < cur ? Math.max(t, cur - dn) : Math.min(t, cur + up);
  o.g = mv(o.g, tg.g); for (let i = 0; i < NB; i++) o.tr[i] = mv(o.tr[i], tg.tr[i]);
}

/* ---- パワーの目安（W）：車重×加速度×速度＋空気抵抗＋転がり。空気の濃さで補正 ---- */
function powerIdx(v, glong, rho) {
  if (!isNum(v) || !isNum(glong) || v < 15) return null;
  const b = SET.bike, ms = v / 3.6, r = isNum(rho) ? rho : 1.2;
  const p = b.mass * glong * G0 * ms + 0.5 * r * b.cda * ms ** 3 + b.crr * b.mass * G0 * ms;
  return p * (1.2 / r);
}
const binOf = rpm => { let k = 0, d = 1e9; for (let i = 0; i < NB; i++) { const e = Math.abs(AX[i] - rpm); if (e < d) { d = e; k = i; } } return k; };

const LEARN = {
  L: LS.get("learnL", new Array(NB).fill(0)), sign: 1, d: 0.5, acc: null, winStart: 0, pairs: 0, last: "",
  reset() { this.sign = 1; this.acc = { p: [], m: [] }; for (let i = 0; i < NB; i++) { this.acc.p.push({ s: 0, n: 0 }); this.acc.m.push({ s: 0, n: 0 }); } this.winStart = now(); },
  clear() { this.L = new Array(NB).fill(0); LS.set("learnL", this.L); this.reset(); this.last = ""; },
  sample() {
    if (!this.acc) this.reset();
    const r = LV.rpm; if (!isNum(r) || r < 3000 || !isNum(LV.glong) || LV.glong < 0.02) return;
    const p = powerIdx(LV.v, LV.glong, LV.rho); if (p == null || p <= 0) return;
    const a = (this.sign > 0 ? this.acc.p : this.acc.m)[binOf(r)]; a.s += p; a.n++;
  },
  /* 1周（コースが無ければ20秒）ごとに向きを変え、+と−がそろったら判定 */
  window() {
    if (!this.acc) this.reset();
    if (this.sign > 0) { this.sign = -1; this.winStart = now(); return; }
    const A = AGGR[SET.heat.aggr] || AGGR.attack; let moved = 0;
    for (let i = 0; i < NB; i++) {
      const p = this.acc.p[i], m = this.acc.m[i]; if (p.n < 10 || m.n < 10) continue;
      const pp = p.s / p.n, pm = m.s / m.n, diff = (pp - pm) / ((pp + pm) / 2);
      const hot = isNum(LV.cht) && LV.cht > SET.heat.warn - 10;
      if (diff > 0.015 && !hot) { this.L[i] += 0.25; moved++; } else if (diff < -0.015) { this.L[i] -= 0.25; moved++; }
      this.L[i] = clamp(this.L[i], -A.learnMax, A.learnMax);
    }
    this.pairs++; this.last = moved ? `学習：${moved}か所を0.25°動かした` : "学習：差が小さいので据え置き";

/* ============================================================
   チーム（走者 ⇄ ピット）：スマホの回線で。
   チーム名と合言葉から宛先と暗号の鍵を作り、公開の中継サーバー（MQTT）2か所を通す。
   中身は AES-GCM で暗号化。中継サーバーや他人には読めない。
   ============================================================ */
const BROKERS_DEF = ["wss://broker.hivemq.com:8884/mqtt", "wss://broker.emqx.io:8084/mqtt"];
const hexOf = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
async function teamKeys(g, p) {
  const te = new TextEncoder();
  const th = await crypto.subtle.digest("SHA-256", te.encode("mxi-topic\n" + g + "\n" + p));
  const base = await crypto.subtle.importKey("raw", te.encode(p), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: te.encode("mxi-key\n" + g), iterations: 100000, hash: "SHA-256" }, base, 256);
  const key = await crypto.subtle.importKey("raw", bits, { name: "AES-GCM" }, false, ["encrypt", "decrypt"]);
  return { topic: "mxi1/" + hexOf(th).slice(0, 32), key };
}
async function aesEnc(key, str) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(str))); const o = new Uint8Array(12 + ct.length); o.set(iv); o.set(ct, 12); return o; }
async function aesDec(key, u8) { if (u8.length < 30) return null; try { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: u8.slice(0, 12) }, key, u8.slice(12))); } catch (e) { return null; } }

/* ブラウザの MQTT（WebSocket）。QoS0・自動でつなぎ直す */
function MqttWS(url, h) {

  const str = s => { const b = te.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const pkt = (h1, body) => { const hd = [h1, ...vlen(body.length)], o = new Uint8Array(hd.length + body.length); o.set(hd); o.set(body, hd.length); return o; };
  const c = { ok: false, subs: [], closed: false, retry: 0, pid: 1, buf: new Uint8Array(0), ws: null, rt: 0, ping: 0, url };
  c.send = u8 => { if (c.ws && c.ws.readyState === 1) c.ws.send(u8); };
  c.connect = () => { if (c.closed) return; let ws; try { ws = new WebSocket(url, "mqtt"); } catch (e) { c.later(); return; }
    ws.binaryType = "arraybuffer"; c.ws = ws; c.buf = new Uint8Array(0);
    ws.onopen = () => { const cid = "mxi" + Math.random().toString(36).slice(2, 12); c.send(pkt(0x10, [...str("MQTT"), 4, 2, 0, 30, ...str(cid)])); };
    ws.onmessage = e => { const d = new Uint8Array(e.data), nb = new Uint8Array(c.buf.length + d.length); nb.set(c.buf); nb.set(d, c.buf.length); c.buf = nb; c.parse(); };
    ws.onclose = () => { if (c.ws !== ws) return; c.ws = null; clearInterval(c.ping); if (c.ok) { c.ok = false; h.state(); } c.later(); };
    ws.onerror = () => { try { ws.close(); } catch (e) { } }; };
  c.later = () => { if (c.closed) return; clearTimeout(c.rt); c.rt = setTimeout(c.connect, Math.min(15000, 1500 * 2 ** Math.min(c.retry++, 4))); };
  c.parse = () => { for (;;) { const b = c.buf; if (b.length < 2) return; let mul = 1, len = 0, i = 1, x;
      do { if (i >= b.length) return; x = b[i++]; len += (x & 127) * mul; mul *= 128; if (i > 5) { try { c.ws.close(); } catch (e) { } return; } } while (x & 128);
      if (b.length < i + len) return; const h0 = b[0], body = b.slice(i, i + len); c.buf = b.slice(i + len); const type = h0 >> 4;
      if (type === 2) { if (body[1] === 0) { c.ok = true; c.retry = 0; c.subs.forEach(c.sub1); clearInterval(c.ping); c.ping = setInterval(() => c.send(new Uint8Array([0xC0, 0])), 15000); h.state(); } else { try { c.ws.close(); } catch (e) { } } }

  c.sub = t => { c.subs.push(t); if (c.ok) c.sub1(t); };
  c.pub = (t, pl, retain) => { if (!c.ok) return false; const tb = str(t), o = new Uint8Array(tb.length + pl.length); o.set(tb); o.set(pl, tb.length); c.send(pkt(0x30 | (retain ? 1 : 0), o)); return true; };
  c.close = () => { c.closed = true; clearTimeout(c.rt); clearInterval(c.ping); const ws = c.ws; c.ws = null; if (ws) { try { if (c.ok) ws.send(new Uint8Array([0xE0, 0])); ws.close(); } catch (e) { } } c.ok = false; };
  return c;
}

const TEAM = {
  on: false, topic: "", key: null, conns: [], q: 1, seen: new Map(), members: new Map(), pend: new Map(),
  view: null,       // ピット側：届いたデータ
  err: "",
  connN() { return this.conns.filter(c => c.ok).length; },
  async join(g, p) {
    this.leave(true);
    if (!(window.crypto && crypto.subtle)) { this.err = "この画面では暗号化が使えません（https のページで開いてください）"; BUS.emit("team"); return false; }
    const k = await teamKeys(g, p); this.topic = k.topic; this.key = k.key; this.on = true; this.err = "";
    SET.team.group = g; SET.team.pass = p; saveSet();
    this.view = { live: {}, laps: [], alerts: [], race: null, cdi: null, course: null, trail: [], at: 0, riderId: null };
    const urls = (SET.team.brokers && SET.team.brokers.length ? SET.team.brokers : BROKERS_DEF);
    this.conns = urls.map(u => { const c = MqttWS(u, { state: () => { BUS.emit("team"); if (c.ok) this.hello(); }, msg: (tp, pl, ret) => this.rx(tp, pl, ret) }); c.sub(this.topic + "/x"); c.sub(this.topic + "/p/+"); c.sub(this.topic + "/s"); c.connect(); return c; });
    BUS.emit("team"); return true;
  },
  leave(silent) { if (!this.on) return; this.pubRaw(this.topic + "/p/" + MYID, new Uint8Array(0), true); this.conns.forEach(c => c.close()); this.conns = []; this.on = false; this.members.clear(); if (!silent) { SET.team.pass = ""; saveSet(); } BUS.emit("team"); },
  pubRaw(t, pl, ret) { this.conns.forEach(c => c.pub(t, pl, ret)); },
  async pub(o, sub, ret) { if (!this.on || !this.key) return; o.i = MYID; o.q = this.q++; o.ts = now(); const pl = await aesEnc(this.key, JSON.stringify(o)); this.pubRaw(this.topic + (sub || "/x"), pl, ret); },
  hello() { this.pub({ k: "hello", n: SET.name, role: SET.role, t: now() }, "/p/" + MYID, true); },
  async rx(tp, pl, ret) {
    if (!this.on || !pl.length) return; const s = await aesDec(this.key, pl); if (!s) return; let o; try { o = JSON.parse(s); } catch (e) { return; }
    if (!o || o.i === MYID) return;
    const last = this.seen.get(o.i + tp.slice(-2)) || 0; if (o.q <= last && !ret) return; this.seen.set(o.i + tp.slice(-2), o.q);   // 2か所から同じのが来るので
    if (o.k === "hello") { this.members.set(o.i, { n: o.n, role: o.role, at: now() }); BUS.emit("team"); return; }
    const m = this.members.get(o.i); if (m) m.at = now(); else this.members.set(o.i, { n: "?", role: "?", at: now() });
    const V = this.view;
    switch (o.k) {
      case "t": V.live = o.d; V.at = now(); V.riderId = o.i; if (isNum(o.d.la)) { V.trail.push([o.d.la, o.d.lo, o.d.v]); if (V.trail.length > 3000) V.trail.splice(0, 500); } PITREC.push(o.d); BUS.emit("remote"); break;
      case "lap": { const i = V.laps.findIndex(l => l.n === o.lap.n && l.t0 === o.lap.t0); if (i >= 0) V.laps[i] = o.lap; else V.laps.push(o.lap); BUS.emit("remoteLap", o.lap); break; }
      case "al": V.alerts = o.list || []; BUS.emit("remoteAlerts"); break;
      case "race": V.race = o.s; BUS.emit("remote"); break;
      case "cdi": V.cdi = o.c; BUS.emit("remoteCdi"); break;
      case "snap": if (o.s) { if (o.s.laps) V.laps = o.s.laps.map(l => { const h = V.laps.find(x => x.n === l.n && x.t0 === l.t0); return h && h.sv && !l.sv ? h : l; }); if (o.s.course) V.course = o.s.course; if (o.s.race) V.race = o.s.race; if (o.s.cdi) V.cdi = o.s.cdi; BUS.emit("remote"); BUS.emit("remoteCdi"); } break;
      case "cmd": this.exec(o); break;

    }
  },
  /* ピット → 走者への命令 */
  cmd(op, a) { return new Promise(res => { if (!this.on) { res({ ok: 0, msg: "チームに参加していません" }); return; } const id = MYID + "-" + (this.q + 1); this.pend.set(id, res); this.pub({ k: "cmd", id, op, a, from: SET.name }); setTimeout(() => { if (this.pend.has(id)) { this.pend.delete(id); res({ ok: 0, msg: "走者から返事がありません" }); } }, 4000); }); },
  async exec(o) {
    if (SET.role !== "rider") return;
    if (!SET.team.accept) { this.pub({ k: "ack", id: o.id, ok: 0, msg: "走者側で「ピットからの変更」がオフです" }); return; }
    const r = await doAct(o.op, o.a, o.from); this.pub({ k: "ack", id: o.id, ok: r.ok ? 1 : 0, msg: r.msg || "" });

  },
};

/* 走者側：定期的に送る */

    lap: LAPS.cur ? { n: LAPS.cur.n, el: rn((now() - LAPS.cur.t0) / 1000, 1), ld: rn(LAPS.liveD, 2) } : null, rec: REC.on ? 1 : 0, lg: now() - LV.lgAt < 2000 ? 1 : 0, cd: CDI_DEV.fresh(2000) ? 1 : 0, sat: L.sat, gsrc: L.gsrc };
}
function teamCdiObj() { return { cfg: CDI.cfg, want: CDI.want, heat: SET.heat, test: SET.test, bike: bikeExport(), presets: PRESETS.map(p => ({ id: p.id, name: p.name, a: p.a, rl: p.rl })), learn: LEARN.L, learnMsg: LEARN.last }; }
let lastCdiPub = 0, lastAlPub = 0, lastSnap = 0;
setInterval(() => {
  if (!TEAM.on || SET.role !== "rider") return;
  TEAM.pub({ k: "t", d: teamLiveObj() });
  const t = now();
  if (t - lastCdiPub > 10000) { lastCdiPub = t; TEAM.pub({ k: "cdi", c: teamCdiObj() }); }
  if (t - lastAlPub > 5000) { lastAlPub = t; TEAM.pub({ k: "al", list: ALERTS.active() }); TEAM.pub({ k: "race", s: RACE.state() }); }
  if (t - lastSnap > 60000) { lastSnap = t; teamSnap(); }
}, 250);
/* 途中から参加したピット用のまとめ（中継サーバーに1つだけ残す）。細かい線は最近3周とベストだけにして小さくする */
function teamSnap() {
  const L = LAPS.list, keep = new Set(L.slice(-3)); if (LAPS.best) keep.add(LAPS.best);
  const laps = L.map(l => { const o = lapWire(l); if (!keep.has(l)) { delete o.sv; delete o.dt; delete o.corners; delete o.straights; } return o; });
  TEAM.pub({ k: "snap", s: { laps, race: RACE.state(), course: COURSE.cur, cdi: teamCdiObj() } }, "/s", true);
}
const lapWire = l => { const o = { ...l }; delete o.i0; delete o.i1; return o; };
BUS.on("lap", l => { if (TEAM.on && SET.role === "rider") { TEAM.pub({ k: "lap", lap: lapWire(l) }); teamSnap(); } });
BUS.on("alerts", () => { if (TEAM.on && SET.role === "rider") { lastAlPub = now(); TEAM.pub({ k: "al", list: ALERTS.active() }); } });
BUS.on("race", () => { if (TEAM.on && SET.role === "rider") TEAM.pub({ k: "race", s: RACE.state() }); });
["cdiCfg", "cdiWant", "bike"].forEach(e => BUS.on(e, () => { if (TEAM.on && SET.role === "rider") { lastCdiPub = now(); TEAM.pub({ k: "cdi", c: teamCdiObj() }); } }));
BUS.on("course", () => { if (TEAM.on && SET.role === "rider") teamSnap(); });

/* ピット側の記録（走者のスマホが壊れても残るように） */

    if (!this.on) { this.on = true; this.ses = { id: "p" + t.toString(36), name: "ピット受信 " + fmtDate(t), start: t, end: t, laps: [], src: "pit", cols: REC.COLS, rows: 0, t0: t }; }
    const r = new Array(REC.COLS.length).fill(null), C = REC.IX;
    r[C.t] = +((t - this.ses.t0) / 1000).toFixed(2); r[C.lat] = d.la; r[C.lon] = d.lo; r[C.v] = d.v; r[C.hdg] = d.h; r[C.rpm] = d.r; r[C.cht] = d.c; r[C.fuel] = d.f; r[C.lean] = d.ln; r[C.glat] = d.gl; r[C.glong] = d.gg; r[C.adv] = d.a; r[C.vb] = d.vb; r[C.at] = d.at; r[C.ap] = d.ap; r[C.ah] = d.ah; r[C.wv] = d.w; r[C.lap] = d.lap ? d.lap.n : null;

/* ============================================================
   操作（この端末でも、ピットからの命令でも同じ関数を通す）
   ============================================================ */
async function doAct(op, a, from) {
  a = a || {};
  try {
    switch (op) {
      case "cdi.use": { const r = await cdiUse(a.i); return { ok: r.ok, msg: r.ok ? `CDI：枠${a.i + 1}で点火` : r.err }; }
      case "cdi.mode": { cdiSetMode(a.m, a.x); return { ok: 1, msg: `CDI：${MODE_TXT[a.m]}` }; }
      case "cdi.fb": { const r = await cdiSetFb(a.i); return { ok: r.ok, msg: r.ok ? `フェイルセーフ：枠${a.i + 1}` : r.err }; }
      case "cdi.slot": { const p = { name: String(a.p.name || "ピットから").slice(0, 18), a: cleanMap(a.p.a), rl: a.p.rl || 10500 }; if (!p.a) return { ok: 0, msg: "マップが不正です" }; const r = await cdiWriteSlot(a.i, p); if (r.ok && a.use) await cdiUse(a.i); return { ok: r.ok, msg: r.ok ? `枠${a.i + 1}に書き込み` : r.err }; }
      case "heat": { for (const k of ["aggr", "warn", "crit", "learn", "manual", "cold"]) if (a[k] !== undefined) SET.heat[k] = a[k]; if (a.aggr && a.keepTh !== true) { SET.heat.warn = AGGR[a.aggr].warn; SET.heat.crit = AGGR[a.aggr].crit; } SET.heat.manual = clamp(+SET.heat.manual || 0, -3, 3); saveSet(); BUS.emit("cdiWant", CDI.want); return { ok: 1, msg: "熱補正を変更しました" }; }
      case "learn.clear": LEARN.clear(); return { ok: 1, msg: "学習をリセットしました" };
      case "test": Object.assign(SET.test, a); saveSet(); if (CDI.want.m === "test") TEST.sendCur(); BUS.emit("cdiWant", CDI.want); return { ok: 1, msg: "テストの設定を変更しました" };
      case "preset.put": { const p = { id: a.id || "p" + uid(), name: String(a.name || "ピットから").slice(0, 24), a: cleanMap(a.a), rl: a.rl || 10500, src: a.src || "pit", t: now() }; if (!p.a) return { ok: 0, msg: "マップが不正です" }; const i = PRESETS.findIndex(x => x.id === p.id); if (i >= 0) PRESETS[i] = p; else PRESETS.push(p); savePresets(); BUS.emit("presets"); return { ok: 1, msg: `プリセット「${p.name}」を受け取りました` }; }
      case "alert": ALERTS.raise({ id: a.id || "pit-msg", lvl: a.lvl || "warn", txt: String(a.txt || "").slice(0, 60), src: "pit", from }); return { ok: 1, msg: "アラートを出しました" };
      case "alert.clear": if (a.id) ALERTS.clear(a.id); else ALERTS.clearAll(); return { ok: 1, msg: "アラートを消しました" };
      case "box": RACE.setBox(a.n == null ? null : clamp(a.n | 0, 0, 99)); if (a.n === 0) ALERTS.raise({ id: "pit-box", lvl: "danger", txt: "PIT IN", src: "pit" }); return { ok: 1, msg: a.n == null ? "ピットイン予定を消しました" : `あと${a.n}周でピットイン` };
      case "race.set": if (isNum(a.laps)) { SET.race.laps = a.laps; RACE.laps = a.laps; } if (isNum(a.mins)) { SET.race.mins = a.mins; RACE.mins = a.mins; } saveSet(); BUS.emit("race", RACE.state()); return { ok: 1, msg: "レースの設定を変更しました" };
      case "race.start": if (!RACE.on) RACE.begin(); return { ok: 1, msg: "レース開始" };
      case "race.end": if (RACE.on) RACE.end(); return { ok: 1, msg: "レース終了" };
      case "refuel": FUEL.refuel("pit"); return { ok: 1, msg: "給油しました（燃費の計算をリセット）" };
      case "bike": { const x = bikeReceive(a.b, from === "この端末" ? "mx" : "pit"); return x ? { ok: 1, msg: `バイク「${x.name}」に切り替えました` } : { ok: 0, msg: "バイクの値が正しくありません" }; }
    }
  } catch (e) { return { ok: 0, msg: String(e.message || e) }; }

/* ピット側は走者へ送る。走者側・ひとりのときはここで実行 */

const TRAIL = [];

/* ============================================================
   サンプル：仮想のカートコース・バイク・CDI・ロガー
   本物と同じ JSON をしゃべるので、つなぎ方以外は全部本物と同じ動き
   ============================================================ */
const SIM = {
  on: false, T: null, t: 0, s: 0, lap: 0, v: 0, rpm: 0, cht: 95, fuel: 1, vb: 12.5, soak: 0, slip: 0, heatBoost: 0, tick: 0,
  cdi: null, links: {}, lastApp: 0,
  ORIGIN: [36.2865, 139.0590],
  build() {
    if (this.T) return this.T;
    const P = [[0, 0], [95, 0], [185, 4], [228, -14], [242, -52], [222, -86], [178, -96], [146, -80], [122, -52], [94, -58], [72, -94], [38, -118], [-12, -124], [-62, -108], [-96, -78], [-104, -38], [-84, -10], [-44, -1]];
    const n = P.length, dense = [];
    for (let i = 0; i < n; i++) { const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      for (let k = 0; k < 40; k++) { const t = k / 40, t2 = t * t, t3 = t2 * t; dense.push([0, 1].map(j => 0.5 * ((2 * p1[j]) + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3))); } }
    const pts = [dense[0]]; let acc = 0; const cum = [0];
    for (let i = 1; i <= dense.length; i++) { const q = dense[i % dense.length], l = pts[pts.length - 1]; let seg = Math.hypot(q[0] - l[0], q[1] - l[1]); let cur = l;
      while (seg >= 1) { const k = 1 / seg; cur = [cur[0] + (q[0] - cur[0]) * k, cur[1] + (q[1] - cur[1]) * k]; pts.push(cur); acc += 1; cum.push(acc); seg -= 1; } }
    const N = pts.length, hd = [], R = [];
    for (let i = 0; i < N; i++) { const a = pts[(i - 3 + N) % N], b = pts[(i + 3) % N]; hd.push(Math.atan2(b[1] - a[1], b[0] - a[0])); }
    for (let i = 0; i < N; i++) { let d = hd[(i + 4) % N] - hd[(i - 4 + N) % N]; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; R.push(8 / Math.max(1e-4, Math.abs(d)) * Math.sign(d || 1)); }
    // 速度の上限：コーナー（横G 0.85）・最高速 → 加速／減速の制約で前後から詰める
    const vmaxTop = 19.2; const vl = R.map(r => Math.min(vmaxTop, Math.sqrt(0.85 * G0 * Math.abs(r))));
    const v = vl.slice(); for (let pass = 0; pass < 3; pass++) {
      for (let i = 1; i < 2 * N; i++) { const a = (i - 1) % N, b = i % N, acc = Math.max(0.3, Math.min(3.0, 2600 / (130 * Math.max(3, v[a])) - 0.02 * v[a] * v[a] / 10)); v[b] = Math.min(v[b], Math.sqrt(v[a] ** 2 + 2 * acc)); }
      for (let i = 2 * N; i > 0; i--) { const a = i % N, b = (i - 1 + N) % N; v[b] = Math.min(v[b], Math.sqrt(v[a] ** 2 + 2 * 5.5)); } }
    const E = enu(this.ORIGIN[0], this.ORIGIN[1]);
    this.T = { pts, ll: pts.map(p => E.ll(p[0], p[1])), R, v, N, len: N, hd };
    return this.T;
  },
  /* 本当の最適進角（アプリは知らない）。レース基本より中〜高回転が少し進めたがる */
  opt(r) { return interpMap([8, 12, 15, 17, 18.5, 19.5, 20.5, 21, 21, 20.5, 19.5, 18, 16.5, 15, 13.5, 12], r); },
  start() {
    if (this.on) return; this.build(); this.on = true; this.t = now(); this.s = 5; this.v = 0; this.cht = 110; this.fuel = 1; this.vb = 12.5; this.soak = 0; this.slip = 0; this.heatBoost = 0;
    this.cdi = { slots: PRE_DEF().concat([...Array(6)].map((_, i) => ({ name: `空き${i + 2}`, a: new Array(NB).fill(18), rl: 10500 }))).slice(0, 8).map(p => ({ n: p.name.replace(/（.*）/, ""), a: p.a.slice(), rl: p.rl })), act: 1, fb: 0, m: "fix", raw: null, live: null, lastApp: now(), trig: 28, crank: 1500, cadv: 8, lat: 20, ttl: 800, fball: 0, cal: 0, fbA: false, n: 0 };
    this.links = { cdi: new SimLink("cdi"), logger: new SimLink("logger") };
    this.links.cdi.name = "MolletXi-CDI(サンプル)"; this.links.logger.name = "MolletXi-LOG(サンプル)";
    this.links.cdi.connect(); this.links.logger.connect();
    CDI_DEV.attach(this.links.cdi); LOG_DEV.attach(this.links.logger);
    // コースと燃料計（サンプル用）
    if (!COURSE.list.some(c => c.id === "csample")) { const a = this.T.ll[2], hd = this.T.hd[2] / D2R; const hdgN = (90 - hd + 360) % 360; const [la, lb] = COURSE.lineHere(a[0], a[1], hdgN); COURSE.list.push({ id: "csample", name: "サンプルサーキット", a: la, b: lb, fwd: null, ref: null, corners: [], straights: [] }); COURSE.save(); }
    COURSE.select("csample");
    if (!FUEL.calOk()) { SET.fuel.full = 1700; SET.fuel.empty = 300; SET.fuel.cap = 4.0; saveSet(); }
    this.iv = setInterval(() => { for (let i = 0; i < (this.speed || 1); i++) this.step(40); }, 40);
    BUS.emit("sim", true);
  },
  stop() { if (!this.on) return; this.on = false; clearInterval(this.iv); CDI_DEV.detachAll(); LOG_DEV.detachAll(); BUS.emit("sim", false); },
  /* アプリ → 仮想CDI */
  fromApp(kind, s) {

  $("#edIn").innerHTML = AX.map((r, i) => `<label>${r >= 10000 ? (r / 1000) + "k" : r}<input type="number" step="0.25" min="0" max="25" data-i="${i}" value="${ED.a[i]}"></label>`).join("");

function mapFromHash() {

    `<p><b>${esc(name)}</b>　リミッター ${rl}rpm</p>

}

  return `<table><thead><tr><th>周</th><th>タイム</th><th>前との差</th><th>ベスト差</th><th>最高速</th><th>平均</th><th>最高回転</th><th>温度</th><th>燃料</th><th>進角</th>${tvCol ? "<th>テスト</th>" : ""}</tr></thead><tbody>${laps.slice().reverse().map(l => `<tr data-lap="${l.n}" class="${sel.includes(l.n) ? "sel" : ""}${best === l ? " best" : ""}">

    <td>${f(l.vmax, 1)}</td><td>${f(l.vavg, 1)}</td><td>${f(l.rpmMax, 0)}</td><td>${f(l.chtMax, 0)}</td><td>${l.fuel != null ? Math.round(l.fuel) + "%" : "–"}</td><td>${f(l.adv, 1)}</td>${tvCol ? `<td>${l.variant == null ? "–" : l.variant ? "B" : "A"}</td>` : ""}</tr>`).join("")}</tbody></table>`;
}
function renderLaps() {

let CMPW = 900;

    if (prev) { const x = crossLine(cc, prev.p, p); if (x && (cc.fwd == null || x.dir === cc.fwd)) { if (cc.fwd == null) cc.fwd = x.dir; const tc = prev.t + (t - prev.t) * x.u;

        if (!cc.ref) { const pts = []; let stop = false; for (let j = cur.i0; j <= i; j++) { const q = rows[j]; if (isNum(q[C.lat])) pts.push([q[C.lat], q[C.lon]]); if (isNum(q[C.v]) && q[C.v] < 5) stop = true; } if (!stop && pts.length > 30) { cc.ref = buildRef(pts); const fc = findCorners(cc.ref); cc.corners = fc.corners; cc.straights = fc.straights; } }
        laps.push(Object.assign({ n: laps.length + 1, t0: cur.t0, ms: tc - cur.t0, i0: cur.i0, i1: i }, lapStats(rows, cur.i0, i, cc))); }
      cur = { t0: tc, i0: i }; } }
    prev = { t, p }; }
  let best = null; laps.forEach((l, k) => { l.dprev = k ? (l.ms - laps[k - 1].ms) / 1000 : null; if (!l.stop && (!best || l.ms < best.ms)) best = l; });
  if (cc.ref && course.id && !course.ref) { const orig = COURSE.list.find(x => x.id === course.id); if (orig) { orig.ref = cc.ref; orig.corners = cc.corners; orig.straights = cc.straights; orig.fwd = cc.fwd; COURSE.update(orig); } }
  return { laps, course: cc };
}
async function exportCsv(id) {
  const s = (REC.on && REC.ses.id === id) ? REC.ses : (ANA.list.find(x => x.id === id) || await DB.getSes(id)); const rows = await loadRows(id);
  let t = `# Mollet Xi 走行記録\n# name=${(s.name || "").replace(/\n/g, " ")}\n# start=${new Date(s.start).toISOString()}\n# source=${s.src || ""}\n` + REC.COLS.join(",") + "\n";
  t += rows.map(r => r.map(x => x == null ? "" : x).join(",")).join("\n");
  download(`mollet-xi-${new Date(s.start).toISOString().slice(0, 16).replace(/[:T]/g, "")}.csv`, "﻿" + t, "text/csv");
}
async function importSession() {
  const fl = await pickFile(".csv,.json,text/csv,application/json"); if (!fl) return;
  const lines = String(fl.text).replace(/^﻿/, "").split(/\r?\n/); let head = null, start = Date.now(), name = fl.name.replace(/\.[^.]+$/, ""); const rows = [];
  for (const ln of lines) { const l = ln.trim(); if (!l) continue; if (l[0] === "#") { const m = l.match(/start=(\S+)/); if (m && isFinite(Date.parse(m[1]))) start = Date.parse(m[1]); const n = l.match(/name=(.+)$/); if (n) name = n[1]; continue; }
    const c = l.split(/[,\t;]/); if (!head) { head = c.map(x => x.trim().toLowerCase()); continue; } rows.push(c.map(x => x.trim() === "" ? null : Number(x))); }
  if (!head) { toast("読めませんでした"); return; }
  // 前のアプリのCSV（time_s, lat, lon, speed_kmh …）にも対応
  const alias = { time_s: "t", time: "t", speed_kmh: "v", speed: "v", alt_m: "alt", acc_m: "acc", heading_deg: "hdg", wheel_kmh: "wv", lng: "lon" };
  const idx = REC.COLS.map(k => head.findIndex(h => (alias[h] || h) === k));
  if (idx[REC.IX.t] < 0) { toast("時間の列がありません"); return; }
  const out = rows.map(r => REC.COLS.map((k, j) => idx[j] < 0 ? null : (isNum(r[idx[j]]) ? r[idx[j]] : null)));
  if (out.length && out[out.length - 1][0] > 1e6) { const t0 = out[0][0]; out.forEach(r => r[0] = (r[0] - t0) / 1000); }
  const s = { id: "i" + Date.now().toString(36), name, start, end: start + (out.length ? out[out.length - 1][0] * 1000 : 0), laps: [], src: "file", cols: REC.COLS, rows: out.length };
  await DB.putChunk(s.id, 0, out); await DB.putSes(s); toast(`${out.length}件を読み込みました`); await refreshSessions(); openSession(s.id);
}

/* ---- サンプル記録（仮想バイクを早送りで走らせる。本物と同じ流れで記録される） ---- */
async function simMakeSession(nLaps) {
  if (!SET.sample) { SHEET.open("サンプル記録を作る", `<p class="hint">サンプルモードで作れます。サンプルモードにしますか？（本物のCDI・ロガーとは切り離されます）</p><div class="row end"><button type="button" class="btn pri" data-ok="1">サンプルモードにして作る</button></div>`, e => { if (e.target.closest("[data-ok]")) { SHEET.close(); setSample(true); setTimeout(() => simMakeSession(nLaps), 300); } }); return; }
  if (REC.on || RACE.on) { toast("記録中・レース中は作れません"); return; }
  const btn = $("#aSample"); if (btn) btn.disabled = true;
  clearInterval(SIM.iv); CLOCK.ff = true; CLOCK.fake = Date.now() - (nLaps + 2) * 75000;
  Object.assign(SIM, { s: 5, v: 0, cht: 125, soak: 0, fuel: 1, lap: 0, heatBoost: 0, slip: 0, lgCut: false, cdiCut: false });
  let B = presetById("psampleB"); const A = presetById("prace") || PRE_DEF()[1];
  if (!B) { B = { id: "psampleB", name: "サンプルB（中高回転 +1.5°）", a: A.a.map((x, i) => AX[i] >= 6000 && AX[i] <= 9500 ? clamp(x + 1.5, 0, 25) : x), rl: 10500, src: "manual", t: now() }; PRESETS.push(B); savePresets(); }
  if (!presetById("prace")) { PRESETS.push(A); savePresets(); }
  SET.test = { a: A.id, b: B.id, by: "lap", sec: 30 }; saveSet();
  LV.lgAt = 0; LV.cdiAt = 0; LV.gAt = 0; lastFix = null; VH.a = []; TH.a = []; FUEL.buf = []; FUEL.pctF = null; FUEL.startPct = null;
  cdiSetMode("test");
  REC.start(`サンプル記録（A/Bテスト${nLaps}周）`, { sample: true });
  let k = 0, nextRec = CLOCK.fake, nextCdi = CLOCK.fake, nextAl = CLOCK.fake; const maxSteps = (nLaps + 3) * 90 * 25;
  try {
    while (LAPS.list.length < nLaps && k < maxSteps) {
      SIM.step(40); CLOCK.fake += 40; k++;
      if (CLOCK.fake >= nextRec) { REC.sample(); nextRec += 100; }
      if (CLOCK.fake >= nextCdi) { cdiLoop(); nextCdi += 200; }
      if (CLOCK.fake >= nextAl) { evalAlerts(); FUEL.tick(0.5); nextAl += 500; }
      if (k % 2500 === 0) { toast(`サンプル記録を作っています… ${LAPS.list.length}/${nLaps}周`, 4000); await new Promise(r => setTimeout(r, 0)); }
    }
    await REC.stop();
  } finally {
    const sid = REC.ses && REC.ses.id;
    CLOCK.fake = null; CLOCK.ff = false; cdiSetMode("fix", { slot: 1 }); ALERTS.clearAll();
    LV.lgAt = 0; LV.cdiAt = 0; LV.gAt = 0; lastFix = null; VH.a = []; TH.a = []; LAPS.reset();
    SIM.iv = setInterval(() => SIM.step(40), 40);
    if (btn) btn.disabled = false;
    if (UI.tab === "ana") { await refreshSessions(); if (sid) openSession(sid); }
  }
}

      <p><b>点火の遅れ時間</b>：遅れ = 周期 ×（パルサー位置 − 進角）÷ 360°。パルサーより進める時は1回転前のパルスから 周期 ×（360° −（進角 − パルサー位置））。周期は1つ前の回転から予測。</p>
      <p><b>後輪の速度</b>：後輪回転(rpm) × タイヤ外周(m) × 60 ÷ 1000 [km/h]。外周 = 外径 × π × 0.96（重さでつぶれる分。SD測る君と同じ）。</p>
      <p><b>マイバイクの取り込み</b>：SD測る君と同じ計算で、ベルトの幅・長さとボスシムからCVTのLow比・Top比を補正（プーリーに巻き付く長さが一定になる半径を求める）。最終減速比は諸元の掛け算・歯数・数値のどれでも。</p>
      <p><b>実際のCVT比</b>：エンジン回転 ÷（後輪回転 × 最終減速比）。Low比を${A.slipPct}%超えたまま1.5秒でベルト／クラッチの滑り。</p>
      <p><b>バンク角</b>：sin(バンク) = 速度 × 鉛直まわりの回転速度 ÷ 重力加速度（IMUの取り付け校正で「上」を決める）。IMUが無いときはGPSの向きの変化から。横G = tan(バンク)。</p>
      <p><b>推定パワー</b>：P = 車重 × 加速度 × 速度 ＋ ½ρ CdA 速度³ ＋ 転がり係数 × 車重 × g × 速度。空気の濃さ ρ（気温・湿度・気圧から）で 1.2kg/m³ に換算。</p>
      <p><b>熱補正</b>：温度 − 警告温度 の分だけ、高回転（ピーク−500rpm以上）を係数×℃ 遅角。中回転は半分、低回転は15%。急上昇なら0.5°足す。上限は攻め度ごと。空気が薄いと最大+1°、気温35℃超で最大−1°。</p>
      <p><b>学習（β）</b>：1周ごとに全体を ±0.5° 交互に動かし、回転域ごとに推定パワーの平均を比べる。1.5%以上の差で良い側へ0.25°。</p>
      <p><b>記録から導く</b>：回転域ごとに進角別の推定パワー平均を出し、3種類以上なら2次式の頂点、2種類なら良い側へ0.5°。1回で±2°まで。</p>
      <p><b>燃料</b>：センダーの電圧を満タン／空で直線に割り当て、加減速・バンク中を除いた中央値をゆっくり平均。消費は 係数 × 回転/1000（減速中は0.35倍）で見積もり、燃料計が15%以上減ったら係数を実測に合わせる。</p>

/* ---- 受け取った値を確かめて、マイバイクの形にそろえる ---- */

  const e = { name: String(o.name || "").trim().slice(0, 24) || "名前なし", from: src, gid: typeof o.gid === "string" ? o.gid.slice(0, 40) : "", gat: n(o.gat, 0, 9e15, 0),
    lo: n(o.lo, 0.3, 8, null), top: n(o.top, 0.2, 3, null), sec: n(o.sec, 1, 60, null), circ: n(o.circ, 500, 3500, null),

function bikeLoad(x) { const e = x && x.id ? bikeClean(x, x.from) : null; return e ? Object.assign(e, { id: String(x.id).slice(0, 40), at: +x.at || 0 }) : null; }

/* ---- このアプリのマイバイク（何台でも） ---- */
const MYB = {
  list: (LS.get("bikes", []) || []).map(bikeLoad).filter(Boolean),
  save() { LS.set("bikes", this.list); },
  get(id) { return id ? this.list.find(x => x.id === id) || null : null; },
  /* SD測る君の同じバイク（gid）か、同じ出どころの同じ名前なら上書き */
  upsert(e) {
    const byGid = e.gid ? this.list.find(y => y.gid === e.gid) : null;
    let x = byGid || this.list.find(y => y.name === e.name && y.from === e.from);
    if (x) { const keep = { id: x.id, at: now() }; if (byGid && x.from === "topspeed") keep.from = "topspeed";   // SD測る君の自動合わせを続ける
