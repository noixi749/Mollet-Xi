const bikeSame = (a, b) => !!a && !!b && BIKE_KEYS.every(k => Math.abs((+a[k] || 0) - (+b[k] || 0)) < 1e-6);
const bikeCur = () => MYB.get(SET.bike.mid);
const bikeDirty = () => { const e = bikeCur(); return !!e && !bikeSame(e, SET.bike); };
const bikeIsDefault = () => bikeSame(SET.bike, SET_DEF().bike) && !SET.bike.mid && !SET.bike.name;
const bikeSig = b => b ? BIKE_KEYS.map(k => (+b[k] || 0).toFixed(4)).join(",") + "|" + (b.name || "") : "";
/* 取り込んだときの説明（ベルト・タイヤなど）のうち、手で直した値でもまだ当てはまるものだけ */
function bikeInfo(cur, v) {
  const o = {}; if (!cur) return o;
  const same = k => Math.abs((+cur[k] || 0) - (+v[k] || 0)) < 1e-6;

/* いま使っている仕様（ピットへ送る・書き出す形） */
function bikeExport() {

}
function bikeSum(x) {

/* 使う。ピット（親機）のときは走者にも送る */

  SET.bike.name = e.name; SET.bike.mid = e.id; saveSet();

/* 名前のない値（手入力のまま）：マイバイクの一覧には入れず、値だけ合わせる */
function bikeUseValues(e) { for (const k of BIKE_KEYS) SET.bike[k] = e[k]; SET.bike.name = ""; SET.bike.mid = ""; saveSet(); BUS.emit("bike"); renderBikeCard(); }

/* ---- SD測る君のマイバイク（同じサイトなら直接読める） ---- */
const TS_PKG = "jp.naohisa.sdhakarukun";

const tsEntry = bk => { const w = TSC.toBike(bk); return w ? bikeClean(w, "topspeed") : null; };
/* SD測る君で直したバイクに合わせる。初めて開いたときは、SD測る君でメーターに使っているバイクを使う */

/* ---- リンク・コード（SD測る君の「Mollet Xi へ」が作る）：MXB1.＋JSONをbase64url ---- */

function bikeFromHash() {

window.addEventListener("hashchange", bikeFromHash);

    ${upd ? `<div class="row"><span class="hint warn" style="flex:1;min-width:160px">SD測る君で「${esc(upd.name)}」が直されています</span><button type="button" class="btn sm pri" data-bkr="1">取り込み直す</button></div>` : ""}
    ${MYB.list.length ? `<div class="plist">${MYB.list.map(item).join("")}</div>` : '<p class="hint">SD測る君の「マイバイク」を取り込むと、いじった仕様（ベルト・シム・ギア・タイヤ）がそのまま入ります。</p>'}
    <div class="row"><button type="button" class="btn${MYB.list.length ? "" : " pri"}" id="bkImp">SD測る君から取り込む${G.bikes.length ? `（${G.bikes.length}台）` : ""}</button></div>
    <details id="bkEdit"${open ? " open" : ""}><summary>数値を直接入れる・直す</summary>
      <div class="flds" style="margin-top:8px">${fld("bMass", "車重＋ライダー（kg）", b.mass, 1)}${fld("bCirc", "タイヤ外周（mm）", b.circ, 1)}
      <label class="fld"><span>タイヤから外周を計算</span><input type="text" id="bTire" placeholder="例 90/100-10" autocomplete="off"></label>
      ${fld("bSec", "最終減速比", b.sec, 0.001)}${fld("bLo", "CVT Low比（補正後）", b.lo, 0.001)}${fld("bTop", "CVT Top比（補正後）", b.top, 0.001)}
      ${fld("bPeak", "ピーク回転（rpm）", b.peak, 100)}${fld("bLim", "走行中の上限回転（rpm）", b.limit, 50)}${fld("bCda", "前面投影×空気抵抗（CdA）", b.cda, 0.05)}${fld("bCrr", "転がり抵抗係数", b.crr, 0.001)}</div>
      <p class="hint">初期値はスーパーモレ純正（BB-FA14B・3.00-10・最終減速比 3.454×3.727）。外周は外径×π×0.96（SD測る君と同じ）。ベルト滑りの判定・パワー推定・理論値マップ・熱補正に使います。</p>
      <div class="row"><button type="button" class="btn pri" id="bSave">この値を使う</button></div>
      <div class="row"><input type="text" id="bkNm" maxlength="24" placeholder="名前（例：モレ 耐久仕様）" value="${esc(b.name)}" style="flex:1;min-width:150px"><button type="button" class="btn" id="bkSaveAs">名前を付けてマイバイクに保存</button></div></details>`;
}
function renderBikeCard() { const c = $("#bikeCard"); if (!c) return; const d = $("#bkEdit"); c.innerHTML = bikeCardHtml(d && d.open); bindBike(); }
function bikeFields() {
  const b = SET.bike, g = (id, d, a, z) => { const el = $("#" + id), v = el && el.value.trim() !== "" ? +el.value : NaN; return isNum(v) && v >= a && v <= z ? v : d; };
  const o = { mass: g("bMass", b.mass, 30, 500), circ: g("bCirc", b.circ, 500, 3500), sec: g("bSec", b.sec, 1, 60), lo: g("bLo", b.lo, 0.3, 8), top: g("bTop", b.top, 0.2, 3), peak: g("bPeak", b.peak, 2000, 20000), limit: g("bLim", b.limit, 2000, 20000), cda: g("bCda", b.cda, 0.05, 3), crr: g("bCrr", b.crr, 0.001, 0.2) };
  if (o.lo <= o.top) { toast("Low比はTop比より大きい値にしてください"); return null; }
  return o;
}
function bindBike() {
  const c = $("#bikeCard"); if (!c) return;
  const tire = $("#bTire"); if (tire) tire.oninput = () => { const od = TSC.tireOD(tire.value); if (od) $("#bCirc").value = Math.round(Math.PI * od * 0.96); };
  c.onclick = e => {
    const u = e.target.closest("[data-bku]"); if (u) { const x = MYB.get(u.dataset.bku); if (x) bikeApply(x); return; }
    const d = e.target.closest("[data-bkd]"); if (d) { if (!armed(d, "削除？")) return; const x = MYB.get(d.dataset.bkd); MYB.del(d.dataset.bkd); if (x && SET.bike.mid === x.id) { SET.bike.mid = ""; saveSet(); } renderBikeCard(); if (x) toast(`「${x.name}」をマイバイクから消しました`); return; }
    if (e.target.closest("[data-bkr]")) { bikeResync(); return; }
    const id = e.target.id;
    if (id === "bkImp") { bikeImportSheet(); return; }
    if (id === "bSave") { const o = bikeFields(); if (!o) return; Object.assign(SET.bike, o); saveSet(); BUS.emit("bike"); toast("バイクの値を使います"); renderBikeCard(); bikeToRider(); return; }
    if (id === "bkSaveAs") {
      const nm = ($("#bkNm").value || "").trim().slice(0, 24); if (!nm) { toast("名前を入れてください"); $("#bkNm").focus(); return; }
      const o = bikeFields(); if (!o) return; const tv = ($("#bTire").value || "").trim(), info = bikeInfo(bikeCur(), Object.assign({}, SET.bike, o));   // ベルトなどの説明は、当てはまるものだけ引き継ぐ
      if (tv && TSC.tireOD(tv)) { info.tire = tv; info.od = Math.round(TSC.tireOD(tv) * 10) / 10; }
      const ne = bikeClean(Object.assign(info, o, { name: nm, gid: "", gat: 0 }), "mx");
      if (!ne) { toast("値を確かめてください"); return; }
      bikeApply(MYB.upsert(ne), { msg: `「${nm}」をマイバイクに保存して使います` });
    }
  };
}

/* ---- ピット：走者のバイクが変わったら合わせる（解析・理論値マップを同じ仕様で計算するため） ---- */
BUS.on("remoteCdi", () => {
  if (SET.role !== "pit" || !TEAM.on || SET.sample || !TEAM.view) return;
  const rb = TEAM.view.cdi && TEAM.view.cdi.bike; if (!rb) return;
  const s = bikeSig(rb); if (s === TEAM.view.bikeSig) return; TEAM.view.bikeSig = s;
  if (bikeSame(rb, SET.bike) && (rb.name || "") === (SET.bike.name || "")) return;
  const e = bikeClean(rb, "rider"); if (!e) return;
  if (!rb.name) { if (!bikeSame(rb, SET.bike)) { bikeUseValues(e); toast("走者のバイクの値に合わせました（解析・理論値マップに使います）", 3500); } return; }
  bikeApply(MYB.upsert(e), { send: false, msg: `走者のバイク「${e.name}」に合わせました（解析・理論値マップに使います）` });
});
/* 同じブラウザでSD測る君を別のタブで直したとき・アプリに戻ってきたとき */
window.addEventListener("storage", e => { if (e.key === TS_KEY) bikeSync(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) bikeSync(); });
window.__mxResume = () => bikeSync();   // アプリ版：SD測る君から戻ってきたとき

/* ============================================================
   Mollet Xi シリーズでデータを見せ合う
   ・走行記録（アプリ版）：Mollet Xi ⇔ 耐久がんこちゃん。ブラウザ版は同じ保存場所なのでそのまま共有
   ・データ盗む君のマップ → CDI のプリセットへ
   ・アプリに戻ってきた時に、向こうで変えた設定を取り込む
   ============================================================ */
const SESSYNC = {
  sib: SYNC.sib, busy: false,
  fname: id => "ses_" + String(id).replace(/[^A-Za-z0-9_-]/g, "") + ".jsonl",
  recording(id) { try { if (REC.on && REC.ses && REC.ses.id === id) return true; } catch (e) { } try { if (PITREC.on && PITREC.ses && PITREC.ses.id === id) return true; } catch (e) { } return false; },
  async run() {
    if (!MXS.native() || this.busy) return; this.busy = true;
    try { await this.publish(); await this.importAll(); } catch (e) { console.warn("sessync", e); }
    this.busy = false;
  },
  /* 自分で記録したものを見せる（受け取ったものは見せ返さない） */
  async publish() {
    const list = await DB.listSes(); const pub = LS.get("sesPub", {}); let ch = false;
    for (const s of list) {
      if (s.from || this.recording(s.id) || (s.end && now() - s.end < 5000)) continue;
      const sig = `${s.end || 0}|${s.name || ""}|${(s.laps || []).length}`; if (pub[s.id] === sig) continue;
      const nm = this.fname(s.id); const cs = await DB.chunks(s.id);
      if (!MXS.putRaw(nm, JSON.stringify({ ses: s }) + "\n")) continue;
      let ok = true; for (const c of cs) { if (!MXS.append(nm, JSON.stringify({ n: c.n, rows: c.rows }) + "\n")) { ok = false; break; } }
      if (ok) { pub[s.id] = sig; ch = true; } else MXS.del(nm);
    }
    for (const id of Object.keys(pub)) if (!list.some(s => s.id === id)) { MXS.del(this.fname(id)); delete pub[id]; ch = true; }   // こちらで消したもの
    if (ch) LS.set("sesPub", pub);
  },
  /* 向こうのアプリで記録したものを受け取る */
  async importAll() {
    const files = MXS.list(this.sib).filter(f => /^ses_[A-Za-z0-9_-]+\.jsonl$/.test(f.n)); if (!files.length) return;
    const local = new Map((await DB.listSes()).map(s => [s.id, s])); const imp = LS.get("sesImp", {}), gone = LS.get("sesGone", {}); let n = 0;
    for (const f of files) {
      const id = f.n.slice(4, -6); if (gone[id]) continue;
      const L = local.get(id); if (L && !L.from) continue;           // こちらで記録したもの
      if (L && imp[id] === f.t) continue;                           // 前と同じ
      let pos = 0, meta = null; const chunks = []; let guard = 0;
      for (;;) {
        const r = MXS.range(this.sib, f.n, pos, 512 * 1024); if (!r || r.err) break;
        for (const ln of String(r.t || "").split("\n")) { if (!ln.trim()) continue; try { const o = JSON.parse(ln); if (o.ses) meta = o.ses; else if (Array.isArray(o.rows)) chunks.push(o); } catch (e) { } }
        if (r.eof || !r.t || r.next <= pos || ++guard > 2000) break; pos = r.next;
      }
      if (!meta || meta.id !== id) continue;
      if (L) await DB.delSes(id);
      for (const c of chunks) await DB.putChunk(id, c.n, c.rows);
      meta.from = this.sib; await DB.putSes(meta); imp[id] = f.t; n++;
    }
    if (n) { LS.set("sesImp", imp); toast(`${MXS.NAMES[this.sib]}から走行記録を${n}件受け取りました`, 3500); try { if (UI.tab === "ana") refreshSessions(); } catch (e) { } }
  },
  forget(id) { const g = LS.get("sesGone", {}); g[id] = 1; LS.set("sesGone", g); },
};

/* アプリに戻ってきた時：向こうで変えた設定を取り込む（記録・レース中は後で） */
let SYNC_WAIT = false;
function syncOnResume() {
  if (!MXS.native()) return;
  let busy = false; try { busy = REC.on || RACE.on; } catch (e) { }
  if (busy) { SYNC_WAIT = true; return; }
  const n = SYNC.pull();
  if (n) { toast(`${MXS.NAMES[SYNC.sib]}で変えた設定を取り込みます`, 1500); setTimeout(() => location.reload(), 900); return; }
  SESSYNC.run();
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncOnResume(); else if (MXS.native()) { SYNC.publish(); SESSYNC.run(); } });
setInterval(() => { if (!SYNC_WAIT) return; let busy = false; try { busy = REC.on || RACE.on; } catch (e) { } if (!busy) { SYNC_WAIT = false; syncOnResume(); } }, 5000);

/* ---- データ盗む君のマップ ---- */
function nusumuMaps() {
  const b = MXS.get("nusumu", "maps"); const L = b && Array.isArray(b.d) ? b.d : [];
  return L.map(m => m && { id: String(m.id || ""), name: String(m.name || "盗んだマップ").slice(0, 24), at: m.at || 0, a: cleanMap(m.a), rl: isNum(m.rl) ? clamp(Math.round(m.rl / 100) * 100, 6000, 14000) : 10500, n: m.n || 0 }).filter(m => m && m.a);
}
function openNusumuMaps() {
  const L = nusumuMaps();
  SHEET.open("データ盗む君のマップ", L.length ? `<div class="plist">${L.map((m, i) => `<div class="pitem"><span class="nm"><b>${esc(m.name)}</b> <small class="hint">${m.at ? fmtDate(m.at) + "・" : ""}${m.n}点・リミッター ${m.rl}rpm<br>${m.a.map(x => x).join(" ")}</small></span><button type="button" class="btn sm pri" data-nsm="${i}">入れる</button></div>`).join("")}</div><p class="hint">プリセットに入れると、CDI（SHIRATAKI）の枠に書き込んだり、エディタで直したりできます。</p>`
    : `<p class="hint">データ盗む君で記録したマップがありません。データ盗む君で記録して保存すると、ここに出ます（${MXS.native() ? "同じスマホにアプリが入っている時" : "同じブラウザで開いている時"}）。</p>`, e => {
      const b = e.target.closest("[data-nsm]"); if (!b) return; const m = L[+b.dataset.nsm]; if (!m) return;
      const p = { id: "p" + uid(), name: ("盗：" + m.name).slice(0, 24), a: m.a.slice(), rl: m.rl, src: "nusumu", t: now() }; PRESETS.push(p); savePresets(); try { renderPresetLists(); } catch (_) { }
      toast(`「${p.name}」をプリセットに入れました`); b.disabled = true; b.textContent = "入れました";
    });
}

setTimeout(() => { if (MXS.native()) SESSYNC.run(); }, 4000);

/* ============================================================
   起動
   ============================================================ */
UI.raceAuto = true;
(function init() {
  if (window.MX_PREVIEW && !LS.get("previewInit", false)) { SET.sample = true; saveSet(); LS.set("previewInit", true); LS.set("seenIntro", true); }
  renderSampleBar();
  if (SET.sample) { SIM.start(); }
  goTab(UI.tab);
  chipState();
  autoReconnect();
  setTimeout(() => { bikeSync(true); bikeFromHash(); mapFromHash(); }, 300);   // SD測る君のマイバイク・受け取ったリンク
  if (APP_ID === "ganko" && LS.get("teamOn", false) && SET.team.group && SET.team.pass) TEAM.join(SET.team.group, SET.team.pass);
  BUS.on("team", () => LS.set("teamOn", TEAM.on));
  window.addEventListener("pagehide", () => { if (REC.on) REC.flush(); if (PITREC.on) PITREC.flush(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { if (REC.on) REC.flush(); if (PITREC.on) PITREC.flush(); } });
  if (!window.MX_PREVIEW && !IS_APK && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => { });
  // 画面を開いた最初の操作で音を使えるようにする
  document.addEventListener("pointerdown", () => SND.unlock(), { once: true });
})();

</script>
